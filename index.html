<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="IRONLOG" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>IRONLOG — Tu gym tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0a0a;
  --bg-2: #131313;
  --bg-3: #1c1c1c;
  --line: #262626;
  --line-2: #333;
  --text: #f5f5f5;
  --text-dim: #b8b8b8;
  --text-faint: #8a8a8a;
  --accent: #d4ff00;
  --accent-dim: #9ab800;
  --danger: #ff3b3b;
  --success: #4ade80;
  --warn: #ffb020;
  --radius: 4px;
  --radius-lg: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family: 'Archivo', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  overscroll-behavior: none;
  padding-top: var(--safe-top);
  padding-bottom: calc(72px + var(--safe-bottom));
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 20% 0%, rgba(212,255,0,0.06), transparent 50%),
    radial-gradient(circle at 80% 100%, rgba(212,255,0,0.04), transparent 50%);
  pointer-events: none;
  z-index: 0;
}
#app { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }

/* ===================== AUTH SCREEN ===================== */
.auth-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}
.auth-screen::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(ellipse at 30% 10%, rgba(212,255,0,0.10), transparent 55%),
    radial-gradient(ellipse at 75% 85%, rgba(212,255,0,0.06), transparent 50%);
  pointer-events: none;
}
.auth-box {
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
  z-index: 1;
}
.auth-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  letter-spacing: 0.06em;
  line-height: 1;
  margin-bottom: 4px;
  color: var(--text);
}
.auth-logo span { color: var(--accent); }
.auth-tagline {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 40px;
}
.auth-divider {
  height: 1px;
  background: var(--line);
  margin: 20px 0;
}
.auth-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
  display: block;
}
.auth-input {
  width: 100%;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--text);
  padding: 14px 16px;
  border-radius: var(--radius);
  font-family: 'Archivo', sans-serif;
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s;
  margin-bottom: 10px;
  -webkit-appearance: none;
}
.auth-input:focus { border-color: var(--accent); }
.auth-input::placeholder { color: var(--text-faint); }
.auth-btn-primary {
  width: 100%;
  padding: 15px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: var(--radius);
  font-family: 'Archivo', sans-serif;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 4px;
  transition: opacity 0.15s, transform 0.1s;
}
.auth-btn-primary:active { transform: scale(0.98); opacity: 0.9; }
.auth-btn-secondary {
  width: 100%;
  padding: 14px;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  font-family: 'Archivo', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
  transition: border-color 0.15s, color 0.15s, transform 0.1s;
}
.auth-btn-secondary:active { transform: scale(0.98); }
.auth-btn-secondary:hover { border-color: var(--text-dim); color: var(--text); }
.auth-error {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--danger);
  letter-spacing: 0.05em;
  text-align: center;
  min-height: 18px;
  margin-top: 10px;
}
.auth-loading {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-align: center;
  margin-top: 10px;
  opacity: 0;
  transition: opacity 0.2s;
}
.auth-loading.visible { opacity: 1; }
/* ===================================================== */

/* HEADER */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 0.08em;
  line-height: 1;
}
.brand span { color: var(--accent); }
.brand-sub {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--text-faint);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 2px;
}
.header-right {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  text-align: right;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.header-user-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 10px;
  cursor: pointer;
  color: var(--text-dim);
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: border-color 0.15s;
}
.header-user-btn:hover { border-color: var(--line-2); }

/* VIEWS */
.view { padding: 20px; display: none; animation: fadeIn 0.25s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.view-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 4px;
}
.view-subtitle {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 24px;
}

/* CARDS */
.card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 12px;
  transition: border-color 0.15s, transform 0.1s;
  cursor: pointer;
}
.card:active { transform: scale(0.99); }
.card-title {
  font-family: 'Archivo', sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.01em;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.card-meta {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.card-meta .icon { color: var(--accent); opacity: 0.85; }
.card-meta .icon svg { width: 12px; height: 12px; }
.card-day-badge {
  display: inline-block;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  padding: 3px 8px;
  background: var(--accent);
  color: #000;
  font-weight: 700;
  border-radius: 3px;
  text-transform: uppercase;
}

/* BUTTONS */
.btn {
  font-family: 'Archivo', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  padding: 14px 20px;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s;
  text-transform: uppercase;
  width: 100%;
}
.btn svg { flex-shrink: 0; }
.btn .icon { display: inline-flex; align-items: center; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:disabled { background: var(--line-2); color: var(--text-faint); cursor: not-allowed; }
.btn-secondary { background: var(--bg-3); color: var(--text); border: 1px solid var(--line-2); }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--line); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-sm { padding: 8px 12px; font-size: 12px; width: auto; }

.btn-icon {
  background: var(--bg-3);
  border: 1px solid var(--line);
  color: var(--text);
  width: 38px; height: 38px;
  border-radius: var(--radius);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 18px;
  transition: all 0.15s;
}
.btn-icon:active { transform: scale(0.92); }
.btn-icon svg { width: 16px; height: 16px; }

/* FORMS */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.field label.label-with-icon { display: flex; align-items: center; gap: 5px; }
.field label.label-with-icon .icon svg { width: 13px; height: 13px; }
input, select, textarea {
  width: 100%;
  background: var(--bg-3);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 12px 14px;
  border-radius: var(--radius);
  font-family: 'Archivo', sans-serif;
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="number"] {
  font-family: 'Space Mono', monospace;
  text-align: center;
  font-weight: 700;
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

/* EMPTY STATE */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; display: flex; justify-content: center; align-items: center; color: var(--text-dim); }
.empty-icon svg { width: 56px; height: 56px; }
.empty-text {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 20px;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  display: flex;
  z-index: 100;
  padding-bottom: var(--safe-bottom);
}
.nav-item {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-faint);
  padding: 12px 8px;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: color 0.15s;
  position: relative;
}
.nav-item.active { color: var(--accent); }
.nav-item.active::before {
  content: ""; position: absolute; top: 0; left: 30%; right: 30%;
  height: 2px; background: var(--accent);
}
.nav-icon { font-size: 20px; line-height: 0; display: flex; align-items: center; justify-content: center; height: 20px; }
.nav-icon svg { width: 20px; height: 20px; }

/* TRAINING MODE */
.training-shell {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 200;
  display: none;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
.training-shell.active { display: flex; }
.training-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.training-progress {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--text-dim);
}
.training-progress span { color: var(--accent); font-weight: 700; }
.progress-bar {
  height: 3px;
  background: var(--bg-3);
  position: relative;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s;
}
.training-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
}
.exercise-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 44px;
  line-height: 1;
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}
.exercise-meta {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.exercise-meta .target { color: var(--accent); font-weight: 700; }
.last-session {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  margin-bottom: 20px;
  border-radius: var(--radius);
}
.last-session-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.last-session-data {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--text);
}

.set-row {
  display: grid;
  grid-template-columns: 36px 1fr 1fr 44px;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
  padding: 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.set-row.done { border-color: var(--accent); background: rgba(212,255,0,0.04); }
.set-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  text-align: center;
  color: var(--text-dim);
}
.set-row.done .set-num { color: var(--accent); }
.set-row input { padding: 10px 6px 10px 26px; font-size: 16px; background: var(--bg-3); }
.set-row .icon-prefix svg { width: 13px; height: 13px; }
.set-check {
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--text-dim);
  width: 100%;
  height: 40px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  padding: 0;
}
.set-check svg { width: 16px; height: 16px; }
.set-row.done .set-check { background: var(--accent); color: #000; border-color: var(--accent); }

.training-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  background: var(--bg-2);
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 10px;
}

/* HISTORIAL */
.history-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-block { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.stat-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
.stat-label.label-with-icon { display: flex; align-items: center; gap: 4px; }
.stat-label .icon { color: var(--accent); }
.stat-label .icon svg { width: 12px; height: 12px; }
.stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 28px; line-height: 1; color: var(--accent); }
.stat-value-sub { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); margin-top: 4px; }

.chart-wrap { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 20px; }
.chart-title { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 10px; }
.chart-title.label-with-icon { display: flex; align-items: center; gap: 6px; }
.chart-title .icon { color: var(--accent); }
.chart-title .icon svg { width: 13px; height: 13px; }

.history-list-item { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.history-date { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
.history-sets { font-family: 'Space Mono', monospace; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; }
.history-set-pill { background: var(--bg-3); padding: 3px 8px; border-radius: 3px; border: 1px solid var(--line-2); }
.history-set-pill.pr { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

/* MODAL */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-backdrop.active { display: flex; }
.modal {
  background: var(--bg-2);
  width: 100%;
  max-width: 600px;
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  max-height: 90vh;
  overflow-y: auto;
  border-top: 1px solid var(--line);
  animation: slideUp 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(--line-2); border-radius: 2px; margin: -8px auto 16px; }
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.04em; line-height: 1; margin-bottom: 18px; }

/* EXERCISE LIST IN ROUTINE EDITOR */
.exercise-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.exercise-item-info { flex: 1; min-width: 0; }
.exercise-item-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exercise-item-meta { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.exercise-item-meta .icon { color: var(--accent); opacity: 0.85; }
.exercise-item-meta .icon svg { width: 12px; height: 12px; }
.exercise-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

.divider { height: 1px; background: var(--line); margin: 16px 0; }

.toast {
  position: fixed;
  bottom: calc(80px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--accent);
  color: #000;
  padding: 10px 18px;
  border-radius: var(--radius);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 400;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); color: #fff; }

.fab-add {
  position: fixed;
  bottom: calc(84px + var(--safe-bottom));
  right: 20px;
  width: 56px; height: 56px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 50%;
  font-size: 28px;
  font-weight: 700;
  cursor: pointer;
  z-index: 90;
  box-shadow: 0 8px 20px rgba(212,255,0,0.25);
  display: none;
}
.fab-add.visible { display: flex; align-items: center; justify-content: center; }
.fab-add:active { transform: scale(0.95); }

.text-dim { color: var(--text-dim); }
.text-accent { color: var(--accent); }
.font-mono { font-family: 'Space Mono', monospace; }
.muted { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; }

.icon { display: inline-block; vertical-align: middle; line-height: 0; }
.icon svg { display: block; }
.label-with-icon { display: flex; align-items: center; gap: 6px; }
.label-with-icon .icon { color: var(--accent); }

.input-with-icon { position: relative; }
.input-with-icon .icon-prefix {
  position: absolute;
  left: 8px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  pointer-events: none;
  z-index: 1;
}
.input-with-icon input { padding-left: 28px; }

select { background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }

/* Sync badge */
.sync-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  padding: 3px 8px;
  border-radius: 12px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  color: var(--text-faint);
  transition: all 0.3s;
}
.sync-badge.syncing { border-color: var(--accent); color: var(--accent); }
.sync-badge.ok { border-color: var(--success); color: var(--success); }
.sync-badge.err { border-color: var(--danger); color: var(--danger); }
.sync-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.sync-badge.syncing .sync-dot { animation: pulse 0.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>

// ---------- TOAST ----------

  clearTimeout(toast._t);

}

// ---------- SYNC BADGE ----------
function setSyncBadge(state) {
  // state: 'syncing' | 'ok' | 'err' | 'idle'
  const b = $('#sync-badge');
  const l = $('#sync-label');
  b.className = 'sync-badge' + (state !== 'idle' ? ' ' + state : '');
  l.textContent = { syncing:'Sincronizando', ok:'Sincronizado', err:'Sin conexión', idle:'—' }[state] || '—';
  if (state === 'ok') setTimeout(() => setSyncBadge('idle'), 2500);
}

// ---------- STATE ----------
const defaultData = () => ({ routines:[], sessions:[], settings:{ weightUnit:'kg' } });
const LKEY = 'ironlog_data_v2';

function loadLocal() {
  try { const r=localStorage.getItem(LKEY); return r ? {...defaultData(),...JSON.parse(r)} : defaultData(); }
  catch(e) { return defaultData(); }
}
function saveLocal() {
  localStorage.setItem(LKEY, JSON.stringify(S.data));
}

const S = { data: loadLocal(), view:'home', training:null, user:null };

// =====================================================
// CLOUD SYNC
// Strategy:
//   - routines: full replace per user_id (delete + insert)
//     The local routine 'id' is stored in a 'local_id' column.
//   - sessions: append-only inserts (we track which ones are already in cloud via session.synced flag)
// =====================================================

async function syncRoutinesToCloud() {
  if (!S.user) return;
  setSyncBadge('syncing');
  try {
    // Delete all user's routines then re-insert
    const { error: delErr } = await sb.from('routines').delete().eq('user_id', S.user.id);
    if (delErr) throw delErr;

    if (S.data.routines.length === 0) { setSyncBadge('ok'); return; }

    const rows = S.data.routines.map(r => ({
      user_id:   S.user.id,
      local_id:  r.id,
      name:      r.name,
      day:       r.day,
      exercises: r.exercises   // JSONB column — stores full exercise array including id, name, sets, etc.
    }));

    const { error: insErr } = await sb.from('routines').insert(rows);
    if (insErr) throw insErr;
    setSyncBadge('ok');
  } catch(e) {
    console.error('syncRoutines:', e);
    setSyncBadge('err');
  }
}

async function syncSessionsToCloud() {
  if (!S.user) return;
  // Only push sessions that haven't been synced yet
  const unsynced = S.data.sessions.filter(s => !s.synced);
  if (!unsynced.length) return;

  setSyncBadge('syncing');
  try {
    const rows = unsynced.map(s => ({
      user_id:      S.user.id,
      local_id:     s.id,
      routine_id:   s.routineId,    // local routine id for display
      routine_name: s.routineName,
      date:         s.date,
      exercises:    s.exercises     // JSONB: [{exerciseId, name, sets:[{weight,reps,done}]}]
    }));

    const { error } = await sb.from('sessions').insert(rows);
    if (error) throw error;

    // Mark as synced locally
    S.data.sessions.forEach(s => { if (!s.synced) s.synced = true; });
    saveLocal();
    setSyncBadge('ok');
  } catch(e) {
    console.error('syncSessions:', e);
    setSyncBadge('err');
  }
}

async function loadCloudData() {
  if (!S.user) return;
  setSyncBadge('syncing');
  try {
    // --- ROUTINES ---
    const { data: rData, error: rErr } = await sb
      .from('routines').select('*').eq('user_id', S.user.id);
    if (rErr) throw rErr;

    S.data.routines = (rData || []).map(r => ({
      id:        r.local_id || r.id,   // prefer local_id so exercise references stay intact
      name:      r.name,
      day:       r.day,
      exercises: r.exercises || []
    }));

    // --- SESSIONS ---
    const { data: sData, error: sErr } = await sb
      .from('sessions').select('*').eq('user_id', S.user.id)
      .order('date', { ascending: false });
    if (sErr) throw sErr;

    S.data.sessions = (sData || []).map(s => ({
      id:          s.local_id || s.id,
      routineId:   s.routine_id,
      routineName: s.routine_name,
      date:        s.date,
      exercises:   s.exercises || [],
      synced:      true
    }));

    saveLocal();
    setSyncBadge('ok');
    render();
  } catch(e) {
    console.error('loadCloud:', e);
    setSyncBadge('err');
    // Fall through: use local data
    render();
  }
}

async function saveData() {
  saveLocal();
  await Promise.all([syncRoutinesToCloud(), syncSessionsToCloud()]);
}

function render() {
  renderHome();
  if (S.view === 'routines') renderRoutines();
  if (S.view === 'history')  renderHistory();
  injectIcons();
}

  if (session) {
    S.user = session.user;
    showApp();
    await loadCloudData();
  } else {
    showAuthScreen();
  }

  sb.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      S.user = session.user;
      showApp();
      if (event === 'SIGNED_IN') await loadCloudData();
    } else {
      S.user = null;
      showAuthScreen();
    }
  });
}

function showApp() {
  $('#auth-screen').style.display = 'none';
  const email = S.user?.email || '';
  const el = $('#settings-email');
  if (el) el.textContent = email;
  renderHeader();
  render();
}

function showAuthScreen() {
  $('#auth-screen').style.display = 'flex';
  setAuthLoading(false);
}

function setAuthLoading(v) {
  $('#auth-loading').classList.toggle('visible', v);
  $('#btn-login').disabled = v;
  $('#btn-register').disabled = v;
}

function setAuthError(msg) {
  $('#auth-error').textContent = msg;
}

$('#btn-login').addEventListener('click', async () => {
  const email = $('#auth-email').value.trim();
  const pass  = $('#auth-password').value;
  if (!email || !pass) { setAuthError('Completá los dos campos.'); return; }
  setAuthError('');
  setAuthLoading(true);
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  setAuthLoading(false);
  if (error) setAuthError(error.message);
});

$('#btn-register').addEventListener('click', async () => {
  const email = $('#auth-email').value.trim();
  const pass  = $('#auth-password').value;
  if (!email || !pass) { setAuthError('Completá los dos campos.'); return; }
  if (pass.length < 6) { setAuthError('La contraseña debe tener al menos 6 caracteres.'); return; }
  setAuthError('');
  setAuthLoading(true);
  const { error } = await sb.auth.signUp({ email, password: pass });
  setAuthLoading(false);
  if (error) { setAuthError(error.message); return; }
  setAuthError('');
  $('#auth-loading').textContent = 'Revisá tu email para confirmar tu cuenta.';
  $('#auth-loading').classList.add('visible');
});

// Enter key on auth inputs
['auth-email','auth-password'].forEach(id => {
  $('#' + id).addEventListener('keydown', e => {
    if (e.key === 'Enter') $('#btn-login').click();
  });
});

$('#btn-logout').addEventListener('click', async () => {
  if (!confirm('¿Cerrar sesión?')) return;
  await sb.auth.signOut();
  S.data = defaultData();
  saveLocal();
});

// ---------- NAV ----------
function setView(name) {
  S.view = name;
  $$('.view').forEach(v => v.classList.remove('active'));
  $('#view-' + name).classList.add('active');

// ---------- HOME ----------
function renderHome() {
  const today = todayIdx();
  const routines = S.data.routines;
  const todayR = routines.filter(r => r.day === today);
  const otherR = routines.filter(r => r.day !== today);

  $('#home-sub').textContent = todayR.length
    ? `Hoy es ${dayNames[today].toLowerCase()}`
    : 'No hay rutina asignada para hoy';

  let html = '';

    html = `<div class="empty">
      <div class="empty-icon" data-icon="emptyBox"></div>
      <div class="empty-text">Aún no creaste rutinas</div>
      <button class="btn btn-primary" onclick="openRoutineEditor()">${icon('plus')} Crear mi primera rutina</button>
    </div>`;
  } else {
    if (todayR.length) {
      html += `<div class="muted" style="margin-bottom:10px;">PARA HOY</div>`;
      todayR.forEach(r => html += routineCardHTML(r, true));

    if (otherR.length) {
      html += `<div class="muted" style="margin: 24px 0 10px;">OTRAS RUTINAS</div>`;

    <div class="card-meta">${icon('calendar')} ${dayNames[r.day]} <span style="opacity:.5">·</span> ${icon('sets')} ${r.exercises.length} ejercicio${r.exercises.length===1?'':'s'}</div>

// ---------- ROUTINE EDITOR ----------
function openRoutineEditor(routineId=null) {
  const editing = routineId ? S.data.routines.find(r=>r.id===routineId) : null;
  const r = editing ? JSON.parse(JSON.stringify(editing)) : { id:uid(), name:'', day:todayIdx(), exercises:[] };

  function renderEditor() {
    openModal(`
      <div class="modal-title">${editing ? 'Editar rutina' : 'Nueva rutina'}</div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="r-name" placeholder="Ej: Pecho + Tríceps" value="${esc(r.name)}" />
      </div>
      <div class="field">
        <label class="label-with-icon">${icon('calendar')} Día</label>
        <select id="r-day">
          ${dayNames.map((n,i)=>`<option value="${i}" ${r.day===i?'selected':''}>${n}</option>`).join('')}
        </select>
      </div>
      <div class="divider"></div>
      <div class="muted" style="margin-bottom:10px;">EJERCICIOS</div>
      <div id="ex-list">
        ${r.exercises.length===0
          ? '<div class="muted" style="text-align:center;padding:20px 0;">Sin ejercicios cargados</div>'
          : r.exercises.map((ex,i)=>`
            <div class="exercise-item">
              <div class="exercise-item-info">
                <div class="exercise-item-name">${esc(ex.name)}</div>
                <div class="exercise-item-meta">${icon('sets')} ${ex.sets} <span style="opacity:.5">×</span> ${icon('reps')} ${ex.repsMin}${ex.repsMax!==ex.repsMin?'-'+ex.repsMax:''}</div>
              </div>
              <div class="exercise-item-actions">
                <button class="btn-icon" data-edit-ex="${i}">${icon('edit')}</button>
                <button class="btn-icon" data-del-ex="${i}">${icon('trash')}</button>
              </div>
            </div>`).join('')}
      </div>
      <button class="btn btn-secondary" id="btn-add-ex" style="margin-top:10px;">${icon('plus')} Agregar ejercicio</button>
      <div class="divider"></div>
      <button class="btn btn-primary" id="btn-save-routine">${icon('check')} Guardar rutina</button>
      ${editing?`<button class="btn btn-danger" id="btn-del-routine" style="margin-top:8px;">${icon('trash')} Eliminar rutina</button>`:''}
    `);

    $('#r-name').addEventListener('input', e => r.name = e.target.value);
    $('#r-day').addEventListener('change', e => r.day = parseInt(e.target.value));

    $('#btn-add-ex').addEventListener('click', () => openExerciseEditor(null, ex => { r.exercises.push(ex); renderEditor(); }, renderEditor));
    $$('[data-edit-ex]').forEach(b => b.addEventListener('click', () => {
      const i = parseInt(b.dataset.editEx);
      openExerciseEditor(r.exercises[i], ex => { r.exercises[i]=ex; renderEditor(); }, renderEditor);
    }));
    $$('[data-del-ex]').forEach(b => b.addEventListener('click', () => {
      r.exercises.splice(parseInt(b.dataset.delEx),1); renderEditor();
    }));

    $('#btn-save-routine').addEventListener('click', async () => {
      if (!r.name.trim()) { toast('Falta el nombre', true); return; }
      if (!r.exercises.length) { toast('Agregá al menos un ejercicio', true); return; }
      r.name = r.name.trim();
      if (editing) {
        const i = S.data.routines.findIndex(x=>x.id===r.id);
        S.data.routines[i] = r;
      } else {
        S.data.routines.push(r);
      }
      await saveData();
      closeModal(); renderRoutines(); renderHome();
      toast(editing ? 'Rutina actualizada' : 'Rutina creada ✓');
    });

    if (editing) {
      $('#btn-del-routine').addEventListener('click', async () => {
        if (confirm('¿Eliminar esta rutina? El historial se mantiene.')) {
          S.data.routines = S.data.routines.filter(x=>x.id!==r.id);
          await saveData();
          closeModal(); renderRoutines(); renderHome();
          toast('Rutina eliminada');
        }
      });
    }
  }
  renderEditor();
}

// ---------- TRAINING MODE ----------
function lastSessionFor(exerciseId) {
  for (let i=S.data.sessions.length-1; i>=0; i--) {
    const s = S.data.sessions[i];
    const ex = s.exercises.find(e=>e.exerciseId===exerciseId);
    if (ex && ex.sets.length) return { date:s.date, sets:ex.sets };
  }
  return null;
}

function startTraining(routineId) {
  const r = S.data.routines.find(x=>x.id===routineId);
  if (!r || !r.exercises.length) { toast('Rutina vacía', true); return; }
  S.training = {
    routineId:    r.id,
    routineName:  r.name,
    exerciseIndex:0,
    startedAt:    new Date().toISOString(),
    exerciseStates: r.exercises.map(ex => {
      const last = lastSessionFor(ex.id);
      return {
        exerciseId: ex.id,
        name:    ex.name,
        sets:    ex.sets,
        repsMin: ex.repsMin,
        repsMax: ex.repsMax,
        notes:   ex.notes,
        lastSession: last,
        records: Array.from({length:ex.sets}, (_,i) => ({
          weight: last && last.sets[i] ? last.sets[i].weight : '',
          reps:   '',
          done:   false
        }))
      };
    })
  };
  closeModal();
  $('#training-shell').classList.add('active');
  $('#training-routine-name').textContent = r.name.toUpperCase();
  renderTrainingExercise();
}

function renderTrainingExercise() {
  const t = S.training;
  const ex = t.exerciseStates[t.exerciseIndex];
  const total = t.exerciseStates.length;
  $('#t-current').textContent = t.exerciseIndex + 1;
  $('#t-total').textContent = total;
  $('#progress-fill').style.width = `${(t.exerciseIndex / total) * 100}%`;

  let lastHTML = '';
  if (ex.lastSession) {
    const sStr = ex.lastSession.sets.map(s=>`${s.weight}×${s.reps}`).join(' · ');
    lastHTML = `<div class="last-session">
      <div class="last-session-label">ÚLTIMA SESIÓN · ${fmtDate(ex.lastSession.date)}</div>
      <div class="last-session-data">${sStr}</div>
    </div>`;
  }

  const setsHTML = ex.records.map((rec,i)=>`
    <div class="set-row ${rec.done?'done':''}" data-set="${i}">
      <div class="set-num">${i+1}</div>
      <div class="input-with-icon">
        <span class="icon-prefix" data-icon="weight"></span>
        <input type="number" inputmode="decimal" placeholder="${S.data.settings.weightUnit}" value="${rec.weight}" data-w="${i}" />
      </div>
      <div class="input-with-icon">
        <span class="icon-prefix" data-icon="reps"></span>
        <input type="number" inputmode="numeric" placeholder="reps" value="${rec.reps}" data-r="${i}" />
      </div>
      <button class="set-check" data-check="${i}">${rec.done?ICONS.check:'<span style="font-size:18px;color:var(--text-faint);">○</span>'}</button>
    </div>`).join('');

  $('#training-body').innerHTML = `
    <div class="exercise-name">${esc(ex.name)}</div>
    <div class="exercise-meta">Objetivo: <span class="target">${ex.sets} × ${ex.repsMin}${ex.repsMax!==ex.repsMin?'-'+ex.repsMax:''} reps</span>${ex.notes?' · '+esc(ex.notes):''}</div>
    ${lastHTML}
    ${setsHTML}`;
  injectIcons($('#training-body'));

  $$('input[data-w]').forEach(inp => inp.addEventListener('input', e => {
    ex.records[parseInt(e.target.dataset.w)].weight = e.target.value;
  }));
  $$('input[data-r]').forEach(inp => inp.addEventListener('input', e => {
    ex.records[parseInt(e.target.dataset.r)].reps = e.target.value;
  }));
  $$('[data-check]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.dataset.check);
    ex.records[i].done = !ex.records[i].done;
    b.closest('.set-row').classList.toggle('done', ex.records[i].done);
    b.innerHTML = ex.records[i].done ? ICONS.check : '<span style="font-size:18px;color:var(--text-faint);">○</span>';
    const num = b.closest('.set-row').querySelector('.set-num');
    if (num) num.style.color = ex.records[i].done ? 'var(--accent)' : '';
  }));

  // Button labels
  if (t.exerciseIndex === 0) {
    $('#btn-prev-ex').innerHTML = `${ICONS.arrowLeft} Atrás`;
    $('#btn-prev-ex').className = 'btn btn-ghost';
    $('#btn-prev-ex').disabled = true;
    $('#btn-prev-ex').style.opacity = '0.35';
  } else {
    $('#btn-prev-ex').innerHTML = `${ICONS.arrowLeft} Atrás`;
    $('#btn-prev-ex').className = 'btn btn-ghost';
    $('#btn-prev-ex').disabled = false;
    $('#btn-prev-ex').style.opacity = '1';
  }
  $('#btn-next-ex').innerHTML = t.exerciseIndex === total-1
    ? `${ICONS.check} Finalizar`
    : `Siguiente ${ICONS.arrowRight}`;
}

$('#btn-next-ex').addEventListener('click', () => {
  const t = S.training;
  if (t.exerciseIndex < t.exerciseStates.length-1) {
    t.exerciseIndex++;
    renderTrainingExercise();
    $('#training-body').scrollTop = 0;
  } else {
    finishTraining();
  }
});

$('#btn-prev-ex').addEventListener('click', () => {
  const t = S.training;
  if (t.exerciseIndex > 0) {
    t.exerciseIndex--;
    renderTrainingExercise();
    $('#training-body').scrollTop = 0;
  }
});

$('#btn-cancel-training').addEventListener('click', () => {
  const t = S.training;
  let hasData = t.exerciseStates.some(ex => ex.records.some(r => r.weight!==''||r.reps!==''||r.done));
  const msg = hasData ? '¿Cancelar el entrenamiento? Vas a perder lo que cargaste.' : '¿Cancelar el entrenamiento?';
  if (confirm(msg)) {
    S.training = null;
    $('#training-shell').classList.remove('active');
    toast('Entrenamiento cancelado');
  }
});

async function finishTraining() {
  const t = S.training;
  const exercises = t.exerciseStates.map(ex => {
    const sets = ex.records
      .filter(r => r.weight!==''||r.reps!=='')
      .map(r => ({ weight: parseFloat(r.weight)||0, reps: parseInt(r.reps)||0, done: !!r.done }));
    return { exerciseId: ex.exerciseId, name: ex.name, sets };
  }).filter(e => e.sets.length > 0);

  if (!exercises.length) {
    if (!confirm('No cargaste ninguna serie. ¿Salir igual?')) return;
    S.training = null;
    $('#training-shell').classList.remove('active');
    return;
  }

  const session = {
    id:          uid(),
    routineId:   t.routineId,
    routineName: t.routineName,
    date:        new Date().toISOString(),
    exercises,
    synced:      false   // will be pushed to cloud in saveData()
  };
  S.data.sessions.push(session);

  // FIX: close training shell FIRST, then navigate, then save to cloud
  S.training = null;
  $('#training-shell').classList.remove('active');
  toast('Sesión guardada ✓');
  setView('home');          // ← returns to home tab

  // Save asynchronously after navigation
  saveData().catch(e => console.error('saveData error:', e));
}

// ---------- HISTORY ----------
function renderHistory() {
  const exMap = {};
  S.data.sessions.forEach(s => {
    s.exercises.forEach(ex => {
      if (!exMap[ex.exerciseId]) exMap[ex.exerciseId] = { id:ex.exerciseId, name:ex.name, sessions:[] };
      exMap[ex.exerciseId].sessions.push({ date:s.date, sets:ex.sets });
    });
  });
  S.data.routines.forEach(r => {
    r.exercises.forEach(ex => {
      if (!exMap[ex.id]) exMap[ex.id] = { id:ex.id, name:ex.name, sessions:[] };
    });
  });

  const list = Object.values(exMap).sort((a,b)=>a.name.localeCompare(b.name));
  const search = $('#history-search').value.toLowerCase().trim();
  const filtered = search ? list.filter(x=>x.name.toLowerCase().includes(search)) : list;

  if (!list.length) {
    $('#history-list').innerHTML = `<div class="empty">
      <div class="empty-icon" data-icon="emptyBox"></div>
      <div class="empty-text">Aún no hay datos.<br>Hacé tu primer entrenamiento.</div>
    </div>`;
    injectIcons($('#history-list')); return;
  }

  $('#history-list').innerHTML = filtered.map(ex => {
    const cnt = ex.sessions.length;
    let pr=0, prReps=0;
    ex.sessions.forEach(s => s.sets.forEach(set => { if(set.weight>pr){pr=set.weight;prReps=set.reps;} }));
    const meta = cnt===0
      ? 'Sin sesiones registradas'
      : `${icon('chart')} ${cnt} sesió${cnt===1?'n':'nes'} <span style="opacity:.5">·</span> ${icon('trophy')} ${pr}${S.data.settings.weightUnit}${prReps?' × '+prReps:''}`;
    return `<div class="card" onclick="openExerciseHistory('${ex.id}')">
      <div class="card-title"><span>${esc(ex.name)}</span><span style="color:var(--text-faint);font-size:14px;">→</span></div>
      <div class="card-meta">${meta}</div>
    </div>`;
  }).join('');
  injectIcons($('#history-list'));
}

$('#history-search').addEventListener('input', renderHistory);

function openExerciseHistory(exerciseId) {
  const sessions = [];
  S.data.sessions.forEach(s => {
    const ex = s.exercises.find(e=>e.exerciseId===exerciseId);
    if (ex) sessions.push({ date:s.date, sets:ex.sets });
  });
  sessions.sort((a,b) => new Date(a.date)-new Date(b.date));

  let name = '';
  for (const r of S.data.routines) {
    const e = r.exercises.find(x=>x.id===exerciseId);
    if (e) { name=e.name; break; }
  }
  if (!name && sessions.length) {
    const s = S.data.sessions.find(s=>s.exercises.some(e=>e.exerciseId===exerciseId));
    name = s?.exercises.find(e=>e.exerciseId===exerciseId)?.name || '';
  }

  let pr=0, prReps=0, prDate=null, best1RM=0;
  sessions.forEach(s => s.sets.forEach(set => {
    if (set.weight>pr||(set.weight===pr&&set.reps>prReps)) { pr=set.weight; prReps=set.reps; prDate=s.date; }
    const est = set.weight*(1+set.reps/30);
    if (est>best1RM) best1RM=est;
  }));

  const total = sessions.length;
  const last  = sessions[sessions.length-1];
  const chartPts = sessions.map(s => {
    const top = s.sets.reduce((m,st)=>st.weight>m.weight?st:m, s.sets[0]);
    return { date:s.date, weight:top.weight, reps:top.reps };
  });

  openModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">${esc(name||'Ejercicio')}</div>
    ${total===0 ? `<div class="empty"><div class="empty-text">Sin sesiones registradas todavía</div></div>` : `
      <div class="history-stat-grid">
        <div class="stat-block">
          <div class="stat-label label-with-icon">${icon('trophy')} PR</div>
          <div class="stat-value">${pr}<span style="font-size:14px;color:var(--text-dim);font-family:'Space Mono';">${S.data.settings.weightUnit}</span></div>
          <div class="stat-value-sub">${prReps} reps · ${prDate?fmtDate(prDate):'—'}</div>
        </div>
        <div class="stat-block">
          <div class="stat-label label-with-icon">${icon('chart')} Sesiones</div>
          <div class="stat-value">${total}</div>
          <div class="stat-value-sub">1RM est ~${best1RM.toFixed(1)}${S.data.settings.weightUnit}</div>
        </div>
      </div>
      <div class="chart-wrap">
        <div class="chart-title label-with-icon">${icon('chart')} EVOLUCIÓN — Top set</div>
        ${renderSparkline(chartPts)}
      </div>
      <div class="muted" style="margin-bottom:10px;">ÚLTIMA SESIÓN — ${last?fmtDateLong(last.date):''}</div>
      <div class="history-list-item">
        <div class="history-sets">
          ${last.sets.map(s=>`<div class="history-set-pill ${s.weight===pr&&s.reps===prReps?'pr':''}">${s.weight}${S.data.settings.weightUnit} × ${s.reps}</div>`).join('')}
        </div>
      </div>
      <div class="muted" style="margin:20px 0 10px;">HISTORIAL COMPLETO</div>
      ${[...sessions].reverse().map(s=>`
        <div class="history-list-item">
          <div class="history-date">${fmtDateLong(s.date)}</div>
          <div class="history-sets">
            ${s.sets.map(set=>`<div class="history-set-pill ${set.weight===pr&&set.reps===prReps?'pr':''}">${set.weight}${S.data.settings.weightUnit} × ${set.reps}</div>`).join('')}
          </div>
        </div>`).join('')}
    `}
  `);
}

function renderSparkline(points) {
  if (!points.length) return '<div class="muted" style="text-align:center;padding:20px;">Sin datos</div>';
  if (points.length===1) return '<div class="muted" style="text-align:center;padding:30px 0;">Necesitás al menos 2 sesiones para ver la curva</div>';

  const unit=S.data.settings.weightUnit, W=600, H=200, PL=42, PR=14, PT=14, PB=28;
  const weights=points.map(p=>p.weight), minW=Math.min(...weights), maxW=Math.max(...weights);
  function niceTicks(min,max,count=4){
    if(min===max){const p=Math.max(1,min*.1);min-=p;max+=p;}
    const range=max-min,raw=range/count,mag=Math.pow(10,Math.floor(Math.log10(raw))),norm=raw/mag;
    let step; if(norm<1.5)step=1*mag; else if(norm<3)step=2*mag; else if(norm<7)step=5*mag; else step=10*mag;
    const nMin=Math.floor(min/step)*step, nMax=Math.ceil(max/step)*step, ticks=[];
    for(let v=nMin;v<=nMax+step*.001;v+=step) ticks.push(parseFloat(v.toFixed(10)));
    return {ticks,min:nMin,max:nMax};
  }
  const {ticks,min:yMin,max:yMax}=niceTicks(minW,maxW,4), yRange=yMax-yMin||1;
  const plotW=W-PL-PR, plotH=H-PT-PB, xStep=points.length>1?plotW/(points.length-1):0;
  const xOf=i=>PL+i*xStep, yOf=w=>PT+plotH-((w-yMin)/yRange)*plotH;
  const coords=points.map((p,i)=>[xOf(i),yOf(p.weight),p]);
  const linePath=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const areaPath=linePath+` L${coords[coords.length-1][0].toFixed(1)},${PT+plotH} L${coords[0][0].toFixed(1)},${PT+plotH} Z`;
  const dots=coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#d4ff00" stroke="#0a0a0a" stroke-width="1.5"/>`).join('');
  const grid=ticks.map(t=>{
    const y=yOf(t).toFixed(1), isFirst=t===ticks[0];
    return `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="${isFirst?'#333':'#262626'}" stroke-width="1" stroke-dasharray="${isFirst?'0':'2,3'}"/>
      <text x="${PL-6}" y="${y}" dy="3" text-anchor="end" font-family="Space Mono,monospace" font-size="9" fill="#b8b8b8">${formatNum(t)}</text>`;
  }).join('');
  const fmt=iso=>{const d=new Date(iso);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;};
  const xLabels=[];
  xLabels.push({x:xOf(0),txt:fmt(points[0].date),anchor:'start'});
  if(points.length>=4){const m=Math.floor(points.length/2);xLabels.push({x:xOf(m),txt:fmt(points[m].date),anchor:'middle'});}
  if(points.length>1) xLabels.push({x:xOf(points.length-1),txt:fmt(points[points.length-1].date),anchor:'end'});
  const xLbls=xLabels.map(l=>`<text x="${l.x}" y="${H-8}" text-anchor="${l.anchor}" font-family="Space Mono,monospace" font-size="9" fill="#8a8a8a">${l.txt}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;max-width:100%;height:auto;">
    <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4ff00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4ff00" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <text x="${PL-6}" y="${PT-2}" text-anchor="end" font-family="Space Mono,monospace" font-size="8" fill="#8a8a8a" letter-spacing="1.5">${unit.toUpperCase()}</text>
    <path d="${areaPath}" fill="url(#grad)"/>
    <path d="${linePath}" fill="none" stroke="#d4ff00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xLbls}
  </svg>`;
}

function formatNum(n) {
  return Math.abs(n-Math.round(n))<0.001 ? String(Math.round(n)) : n.toFixed(1);
}

// ---------- SETTINGS ----------
$('#btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(S.data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`ironlog-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Backup descargado');
});
$('#btn-import').addEventListener('click', () => $('#file-import').click());
$('#file-import').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const obj = JSON.parse(ev.target.result);
      if (!obj.routines || !obj.sessions) throw new Error('Formato inválido');
      if (!confirm('Esto reemplazará tus datos actuales. ¿Continuar?')) return;
      S.data = {...defaultData(),...obj};
      await saveData();
      toast('Datos importados');
      render();
    } catch(err) { toast('Archivo inválido', true); }
  };
  reader.readAsText(file);
});
$('#btn-clear').addEventListener('click', async () => {
  if (confirm('¿Borrar TODAS las rutinas y el historial? No se puede deshacer.')) {
    if (confirm('Última oportunidad. ¿Confirmás?')) {
      S.data = defaultData();
      await saveData();
      toast('Todo borrado');
      render();
    }
  }
});

// ---------- MODAL ----------
function openModal(html) {
  $('#modal-content').innerHTML = `<div class="modal-handle"></div>${html}`;
  $('#modal-backdrop').classList.add('active');
  injectIcons($('#modal-content'));
}
function closeModal() {
  $('#modal-backdrop').classList.remove('active');
}
$('#modal-backdrop').addEventListener('click', e => {
  if (e.target === $('#modal-backdrop')) closeModal();
});

// ---------- SERVICE WORKER ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// ---------- INIT ----------
renderHeader();
injectIcons();
initAuth();

// Expose to inline onclick
window.setView          = setView;
window.openRoutineDetail  = openRoutineDetail;
window.openRoutineEditor  = openRoutineEditor;
window.startTraining    = startTraining;
window.openExerciseHistory = openExerciseHistory;
window.closeModal       = closeModal;
</script>
