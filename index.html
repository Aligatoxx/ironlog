<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="IRONLOG" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>IRONLOG — Tu gym tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0a; --bg-2:#131313; --bg-3:#1c1c1c;
  --line:#262626; --line-2:#333;
  --text:#f5f5f5; --text-dim:#b8b8b8; --text-faint:#8a8a8a;
  --accent:#d4ff00; --danger:#ff3b3b; --success:#4ade80;
  --radius:4px; --radius-lg:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{
  font-family:'Archivo',sans-serif;background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.45;overscroll-behavior:none;
  padding-top:var(--safe-top);padding-bottom:calc(72px + var(--safe-bottom));min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 20% 0%,rgba(212,255,0,.06),transparent 50%),
                   radial-gradient(circle at 80% 100%,rgba(212,255,0,.04),transparent 50%);
}
#app{position:relative;z-index:1;max-width:600px;margin:0 auto;}

/* ── AUTH ── */
.auth-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;
}
.auth-screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 30% 10%,rgba(212,255,0,.10),transparent 55%),
             radial-gradient(ellipse at 75% 85%,rgba(212,255,0,.06),transparent 50%);
}
.auth-box{width:100%;max-width:360px;position:relative;z-index:1;}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:.06em;line-height:1;margin-bottom:4px;}
.auth-logo span{color:var(--accent);}
.auth-tagline{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-faint);letter-spacing:.25em;text-transform:uppercase;margin-bottom:36px;}
.auth-label{display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
.auth-input{
  width:100%;background:var(--bg-3);border:1px solid var(--line-2);color:var(--text);
  padding:14px 16px;border-radius:var(--radius);font-family:'Archivo',sans-serif;font-size:16px;
  outline:none;transition:border-color .15s;margin-bottom:10px;-webkit-appearance:none;
}
.auth-input:focus{border-color:var(--accent);}
.auth-input::placeholder{color:var(--text-faint);}
.auth-btn-primary{
  width:100%;padding:15px;background:var(--accent);color:#000;border:none;
  border-radius:var(--radius);font-family:'Archivo',sans-serif;font-weight:800;
  font-size:14px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  margin-top:4px;transition:opacity .15s,transform .1s;
}
.auth-btn-primary:active{transform:scale(.98);opacity:.9;}
.auth-btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.auth-btn-secondary{
  width:100%;padding:14px;background:transparent;color:var(--text-dim);
  border:1px solid var(--line-2);border-radius:var(--radius);font-family:'Archivo',sans-serif;
  font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;margin-top:8px;transition:border-color .15s,color .15s,transform .1s;
}
.auth-btn-secondary:active{transform:scale(.98);}
.auth-btn-secondary:disabled{opacity:.5;cursor:not-allowed;}
.auth-msg{
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.05em;
  text-align:center;min-height:20px;margin-top:12px;padding:8px;border-radius:var(--radius);
  display:none;
}
.auth-msg.error{display:block;color:var(--danger);background:rgba(255,59,59,.08);border:1px solid rgba(255,59,59,.2);}
.auth-msg.info{display:block;color:var(--text-dim);background:var(--bg-3);border:1px solid var(--line);}

/* Pantalla de carga inicial */
#boot-screen{
  position:fixed;inset:0;background:var(--bg);z-index:8888;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.boot-logo{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:.08em;}
.boot-logo span{color:var(--accent);}
.boot-spinner{
  width:24px;height:24px;border:2px solid var(--line-2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-label{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-faint);letter-spacing:.2em;text-transform:uppercase;}

/* ── HEADER ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 10px;border-bottom:1px solid var(--line);background:var(--bg);
}
.brand{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.08em;line-height:1;}
.brand span{color:var(--accent);}
.brand-sub{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-faint);letter-spacing:.2em;text-transform:uppercase;margin-top:2px;}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.header-date{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;}

.sync-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;
  padding:3px 8px;border-radius:12px;background:var(--bg-3);border:1px solid var(--line);
  color:var(--text-faint);transition:all .3s;
}
.sync-badge.syncing{border-color:var(--accent);color:var(--accent);}
.sync-badge.ok{border-color:var(--success);color:var(--success);}
.sync-badge.err{border-color:var(--danger);color:var(--danger);}
.sync-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.sync-badge.syncing .sync-dot{animation:blink .8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── VIEWS ── */
.view{padding:20px;display:none;animation:fadeIn .22s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.view-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.04em;line-height:1;margin-bottom:4px;}
.view-subtitle{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-faint);letter-spacing:.2em;text-transform:uppercase;margin-bottom:24px;}

/* ── CARDS ── */
.card{
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px;margin-bottom:12px;transition:border-color .15s,transform .1s;cursor:pointer;
}
.card:active{transform:scale(.99);}
.card-title{font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.card-meta{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.card-meta .icon{color:var(--accent);opacity:.85;}
.card-meta .icon svg{width:12px;height:12px;}
.card-day-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.15em;padding:3px 8px;background:var(--accent);color:#000;font-weight:700;border-radius:3px;text-transform:uppercase;}

/* ── BUTTONS ── */
.btn{
  font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;
  padding:14px 20px;border:none;border-radius:var(--radius);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s;text-transform:uppercase;width:100%;
}
.btn svg{flex-shrink:0;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:disabled{background:var(--line-2);color:var(--text-faint);cursor:not-allowed;}
.btn-secondary{background:var(--bg-3);color:var(--text);border:1px solid var(--line-2);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-sm{padding:8px 12px;font-size:12px;width:auto;}
.btn-icon{
  background:var(--bg-3);border:1px solid var(--line);color:var(--text);
  width:38px;height:38px;border-radius:var(--radius);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;
}
.btn-icon:active{transform:scale(.92);}
.btn-icon svg{width:16px;height:16px;}

/* ── FORMS ── */
.field{margin-bottom:14px;}
.field label{display:block;font-family:'Space Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px;}
.field label.label-with-icon{display:flex;align-items:center;gap:5px;}
input,select,textarea{
  width:100%;background:var(--bg-3);border:1px solid var(--line);color:var(--text);
  padding:12px 14px;border-radius:var(--radius);font-family:'Archivo',sans-serif;font-size:16px;
  outline:none;transition:border-color .15s;-webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
input[type="number"]{font-family:'Space Mono',monospace;text-align:center;font-weight:700;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
select{
  background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;
}
.input-with-icon{position:relative;}
.input-with-icon .icon-prefix{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;z-index:1;}
.input-with-icon input{padding-left:28px;}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 20px;color:var(--text-dim);}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5;display:flex;justify-content:center;align-items:center;}
.empty-icon svg{width:56px;height:56px;}
.empty-text{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:20px;}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg-2);border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:var(--safe-bottom);}
.nav-item{
  flex:1;background:none;border:none;color:var(--text-faint);padding:12px 8px;
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .15s;position:relative;
}
.nav-item.active{color:var(--accent);}
.nav-item.active::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--accent);}
.nav-icon{font-size:20px;line-height:0;display:flex;align-items:center;justify-content:center;height:20px;}
.nav-icon svg{width:20px;height:20px;}

/* ── TRAINING ── */
.training-shell{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:none;flex-direction:column;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
}
.training-shell.active{display:flex;}
.training-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.training-progress{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--text-dim);}
.training-progress span{color:var(--accent);font-weight:700;}
.progress-bar{height:3px;background:var(--bg-3);}
.progress-bar-fill{height:100%;background:var(--accent);transition:width .3s;}
.training-body{flex:1;overflow-y:auto;padding:24px 20px;}
.exercise-name{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;letter-spacing:.02em;margin-bottom:6px;}
.exercise-meta{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:24px;}
.exercise-meta .target{color:var(--accent);font-weight:700;}
.last-session{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:12px 14px;margin-bottom:20px;border-radius:var(--radius);}
.last-session-label{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;}
.last-session-data{font-family:'Space Mono',monospace;font-size:13px;color:var(--text);}
.set-row{display:grid;grid-template-columns:36px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px;padding:8px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);}
.set-row.done{border-color:var(--accent);background:rgba(212,255,0,.04);}
.set-num{font-family:'Bebas Neue',sans-serif;font-size:20px;text-align:center;color:var(--text-dim);}
.set-row.done .set-num{color:var(--accent);}
.set-row input{padding:10px 6px 10px 26px;font-size:16px;background:var(--bg-3);}
.set-check{
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--text-dim);
  width:100%;height:40px;border-radius:var(--radius);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;
}
.set-check svg{width:16px;height:16px;}
.set-row.done .set-check{background:var(--accent);color:#000;border-color:var(--accent);}
.training-footer{padding:14px 20px;border-top:1px solid var(--line);background:var(--bg-2);display:grid;grid-template-columns:1fr 2fr;gap:10px;}

/* ── HISTORY ── */
.history-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.stat-block{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
.stat-label{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;}
.stat-label.label-with-icon{display:flex;align-items:center;gap:4px;}
.stat-label .icon{color:var(--accent);}
.stat-label .icon svg{width:12px;height:12px;}
.stat-value{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:var(--accent);}
.stat-value-sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:4px;}
.chart-wrap{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:20px;}
.chart-title{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.chart-title .icon{color:var(--accent);}
.chart-title .icon svg{width:13px;height:13px;}
.history-list-item{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;}
.history-date{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px;}
.history-sets{font-family:'Space Mono',monospace;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;}
.history-set-pill{background:var(--bg-3);padding:3px 8px;border-radius:3px;border:1px solid var(--line-2);}
.history-set-pill.pr{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}

/* ── MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.modal-backdrop.active{display:flex;}
.modal{
  background:var(--bg-2);width:100%;max-width:600px;
  border-top-left-radius:16px;border-top-right-radius:16px;
  padding:20px 20px calc(20px + var(--safe-bottom));max-height:90vh;overflow-y:auto;
  border-top:1px solid var(--line);animation:slideUp .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:36px;height:4px;background:var(--line-2);border-radius:2px;margin:-8px auto 16px;}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;line-height:1;margin-bottom:18px;}

/* ── EXERCISE ITEMS ── */
.exercise-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;}
.exercise-item-info{flex:1;min-width:0;}
.exercise-item-name{font-weight:700;font-size:15px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.exercise-item-meta{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.1em;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.exercise-item-meta .icon{color:var(--accent);opacity:.85;}
.exercise-item-meta .icon svg{width:12px;height:12px;}
.exercise-item-actions{display:flex;gap:6px;flex-shrink:0;}

/* ── MISC ── */
.divider{height:1px;background:var(--line);margin:16px 0;}
.muted{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:.1em;}
.icon{display:inline-block;vertical-align:middle;line-height:0;}
.icon svg{display:block;}
.label-with-icon{display:flex;align-items:center;gap:6px;}
.label-with-icon .icon{color:var(--accent);}
.toast{
  position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--accent);color:#000;padding:10px 18px;border-radius:var(--radius);
  font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;opacity:0;pointer-events:none;transition:all .3s;z-index:400;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--danger);color:#fff;}
.fab-add{
  position:fixed;bottom:calc(84px + var(--safe-bottom));right:20px;
  width:56px;height:56px;background:var(--accent);color:#000;border:none;border-radius:50%;
  font-size:28px;font-weight:700;cursor:pointer;z-index:90;
  box-shadow:0 8px 20px rgba(212,255,0,.25);display:none;
}
.fab-add.visible{display:flex;align-items:center;justify-content:center;}
.fab-add:active{transform:scale(.95);}
.settings-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px;}
.settings-label{font-family:'Space Mono',monospace;font-size:9px;color:var(--text-faint);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;}
.settings-value{font-weight:700;font-size:15px;margin-bottom:12px;word-break:break-all;}
</style>
</head>
<body>

<!-- BOOT (se muestra mientras Supabase resuelve la sesión) -->
<div id="boot-screen">
  <div class="boot-logo">IRON<span>LOG</span></div>
  <div class="boot-spinner"></div>
  <div class="boot-label">Cargando...</div>
</div>

<!-- AUTH (oculto hasta confirmar que no hay sesión) -->
<div id="auth-screen" class="auth-screen" style="display:none;">
  <div class="auth-box">
    <div class="auth-logo">IRON<span>LOG</span></div>
    <div class="auth-tagline">Cargá · Entrená · Progresá</div>
    <label class="auth-label">Email</label>
    <input type="email" id="auth-email" class="auth-input" placeholder="tu@email.com" autocomplete="email" />
    <label class="auth-label">Contraseña</label>
    <input type="password" id="auth-password" class="auth-input" placeholder="••••••••" autocomplete="current-password" />
    <button id="btn-login" class="auth-btn-primary">Iniciar sesión</button>
    <button id="btn-register" class="auth-btn-secondary">Crear cuenta nueva</button>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<!-- APP (oculto hasta tener sesión y datos) -->
<div id="app" style="display:none;">
  <div class="header">
    <div>
      <div class="brand">IRON<span>LOG</span></div>
      <div class="brand-sub">Tu gym tracker</div>
    </div>
    <div class="header-right">
      <div class="header-date" id="today-label">—</div>
      <div class="sync-badge" id="sync-badge"><span class="sync-dot"></span><span id="sync-label">—</span></div>
    </div>
  </div>

  <div class="view active" id="view-home">
    <div class="view-title">Hoy</div>
    <div class="view-subtitle" id="home-sub">Elegí qué entrenar</div>
    <div id="home-content"></div>
  </div>

/* ── SYNC BADGE ── */
let _sbTimer = null;

  l.textContent = {syncing:'Sincronizando', ok:'Sincronizado', err:'Sin conexión', idle:'—'}[state] || '—';

/* ── LOCAL STORAGE ── */
const LKEY = 'ironlog_v3';
const defData = () => ({ routines:[], sessions:[], settings:{ weightUnit:'kg' } });

function loadLocal() {
  try { const r = localStorage.getItem(LKEY); return r ? {...defData(), ...JSON.parse(r)} : defData(); }
  catch(e) { return defData(); }
}
function saveLocal() { localStorage.setItem(LKEY, JSON.stringify(G.data)); }

/* ── GLOBAL STATE ── */
const G = { data: loadLocal(), view: 'home', training: null, user: null };

/* ══════════════════════════════════════════
   CLOUD
   Schema (columnas existentes, sin agregar nada):
     routines: id(uuid), user_id, name, day, exercises(jsonb)
     sessions: id(uuid), user_id, routine_id, routine_name, date, exercises(jsonb)

   Truco para conservar el id local de la rutina sin columna extra:
   Guardamos el id local DENTRO del jsonb de exercises como campo especial _lid.
   Al leer, extraemos _lid y lo usamos como id local.
══════════════════════════════════════════ */

async function cloudLoad() {
  if (!G.user) return;
  syncBadge('syncing');
  try {
    // ── Rutinas ──
    const { data: rd, error: re } = await sb
      .from('routines').select('id,name,day,exercises').eq('user_id', G.user.id);
    if (re) throw re;

    G.data.routines = (rd || []).map(r => {
      let lid, items;
      if (Array.isArray(r.exercises)) {
        // formato viejo (array plano) — usamos el uuid de cloud como id local
        lid = r.id; items = r.exercises;
      } else if (r.exercises && r.exercises._lid) {
        // formato nuevo con id local embebido
        lid = r.exercises._lid; items = r.exercises.items || [];
      } else {
        lid = r.id; items = [];
      }
      return { id: lid, _cloudId: r.id, name: r.name, day: r.day, exercises: items };
    });

    // ── Sesiones ──
    const { data: sd, error: se } = await sb
      .from('sessions').select('id,routine_id,routine_name,date,exercises')
      .eq('user_id', G.user.id).order('date', { ascending: false });
    if (se) throw se;

    G.data.sessions = (sd || []).map(s => ({
      id:          s.id,
      cloudId:     s.id,
      routineId:   s.routine_id,
      routineName: s.routine_name,
      date:        s.date,
      exercises:   Array.isArray(s.exercises) ? s.exercises : [],
    }));

    saveLocal();
    syncBadge('ok');
    renderAll();
  } catch(err) {
    console.error('cloudLoad:', err);
    syncBadge('err');
    renderAll(); // igual mostramos datos locales
  }
}

async function cloudSaveRoutines() {
  if (!G.user) return true;
  const { error: de } = await sb.from('routines').delete().eq('user_id', G.user.id);
  if (de) { console.error('routines delete:', de); return false; }
  if (!G.data.routines.length) return true;
  const rows = G.data.routines.map(r => ({
    user_id:   G.user.id,
    name:      r.name,
    day:       r.day,
    exercises: { _lid: r.id, items: r.exercises }
  }));
  const { error: ie } = await sb.from('routines').insert(rows);
  if (ie) { console.error('routines insert:', ie); return false; }
  return true;
}

async function cloudSaveSessions() {
  if (!G.user) return true;
  const pending = G.data.sessions.filter(s => !s.cloudId);
  if (!pending.length) return true;
  const rows = pending.map(s => ({
    user_id:      G.user.id,
    routine_id:   s.routineId,
    routine_name: s.routineName,
    date:         s.date,
    exercises:    s.exercises
  }));
  const { data, error } = await sb.from('sessions').insert(rows).select('id');
  if (error) { console.error('sessions insert:', error); return false; }
  if (data && data.length) {
    let ci = 0;
    G.data.sessions.forEach(s => { if (!s.cloudId && ci < data.length) { s.cloudId = data[ci].id; ci++; } });
    saveLocal();
  }
  return true;
}

async function cloudSave() {
  saveLocal();
  if (!G.user) return;
  syncBadge('syncing');
  const [r1, r2] = await Promise.all([cloudSaveRoutines(), cloudSaveSessions()]);
  syncBadge(r1 && r2 ? 'ok' : 'err');
}

/* ══════════════════════════════════════════
   AUTH — único punto de entrada.
   onAuthStateChange maneja TODOS los estados.
   Boot screen se oculta cuando tengamos certeza
   del estado (sesión o no sesión).
══════════════════════════════════════════ */

function showApp(user) {
  G.user = user;
  $('#boot-screen').style.display  = 'none';
  $('#auth-screen').style.display  = 'none';
  $('#app').style.display          = 'block';
  $('#bottom-nav').style.display   = 'flex';
  $('#settings-email').textContent = user.email || '—';
  renderHeader();
  renderAll();
}

function showAuth() {
  G.user = null;
  $('#boot-screen').style.display = 'none';
  $('#auth-screen').style.display = 'flex';
  $('#app').style.display         = 'none';
  $('#bottom-nav').style.display  = 'none';
  syncBadge('idle');
}

// El listener es el ÚNICO responsable de decidir qué mostrar.
// Cubre: sesión en caché (INITIAL_SESSION), login nuevo (SIGNED_IN), logout (SIGNED_OUT).
sb.auth.onAuthStateChange(async (event, session) => {
  console.log('auth event:', event, !!session);

  if (event === 'SIGNED_OUT') {
    G.data = defData(); saveLocal();
    showAuth();
    return;
  }

  if (session) {
    // INITIAL_SESSION (caché), SIGNED_IN, TOKEN_REFRESHED — todos muestran la app y cargan datos
    const firstTime = !G.user;
    showApp(session.user);
    if (firstTime || event === 'SIGNED_IN') {
      await cloudLoad();
    }
  } else {
    // INITIAL_SESSION sin sesión
    showAuth();
  }
});

/* ── AUTH FORM ── */
function setAuthMsg(msg, type='error') {
  const el = $('#auth-msg');
  el.textContent = msg;
  el.className = 'auth-msg' + (msg ? ' ' + type : '');
}
function setAuthBusy(v) {
  ['btn-login','btn-register','auth-email','auth-password'].forEach(id => $(('#'+id)).disabled = v);
}

$('#btn-login').addEventListener('click', async () => {
  const email = $('#auth-email').value.trim();
  const pass  = $('#auth-password').value;
  if (!email || !pass) { setAuthMsg('Completá los dos campos.'); return; }
  setAuthMsg(''); setAuthBusy(true);
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  setAuthBusy(false);
  if (error) setAuthMsg(error.message);
  // éxito → onAuthStateChange SIGNED_IN se dispara solo
});

$('#btn-register').addEventListener('click', async () => {
  const email = $('#auth-email').value.trim();
  const pass  = $('#auth-password').value;
  if (!email || !pass) { setAuthMsg('Completá los dos campos.'); return; }
  if (pass.length < 6) { setAuthMsg('La contraseña debe tener al menos 6 caracteres.'); return; }
  setAuthMsg(''); setAuthBusy(true);
  const { error } = await sb.auth.signUp({ email, password: pass });
  setAuthBusy(false);
  if (error) { setAuthMsg(error.message); return; }
  setAuthMsg('Revisá tu email para confirmar la cuenta.', 'info');
});

['auth-email','auth-password'].forEach(id => {
  $(('#'+id)).addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-login').click(); });
});

$('#btn-logout').addEventListener('click', async () => {
  if (!confirm('¿Cerrar sesión?')) return;
  await sb.auth.signOut();
  // onAuthStateChange SIGNED_OUT se encarga del resto
});

  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  $('#fab-add').classList.toggle('visible', name === 'routines');
  if (name === 'home')     renderHome();
  if (name === 'routines') renderRoutines();
  if (name === 'history')  renderHistory();

/* ── ROUTINE EDITOR ── */
function openRoutineEditor(routineId=null) {
  const editing = routineId ? G.data.routines.find(r => r.id === routineId) : null;
  const r = editing ? JSON.parse(JSON.stringify(editing)) : { id:uid(), name:'', day:todayN(), exercises:[] };

  function draw() {
    openModal(`
      <div class="modal-title">${editing ? 'Editar rutina' : 'Nueva rutina'}</div>
      <div class="field"><label>Nombre</label><input type="text" id="r-name" placeholder="Ej: Pecho + Tríceps" value="${esc(r.name)}" /></div>
      <div class="field"><label class="label-with-icon">${ico('calendar')} Día</label>
        <select id="r-day">${DAYS.map((n,i) => `<option value="${i}" ${r.day===i?'selected':''}>${n}</option>`).join('')}</select>
      </div>
      <div class="divider"></div>
      <div class="muted" style="margin-bottom:10px;">EJERCICIOS</div>
      <div id="ex-list">
        ${!r.exercises.length
          ? '<div class="muted" style="text-align:center;padding:20px 0;">Sin ejercicios cargados</div>'
          : r.exercises.map((ex,i) => `
            <div class="exercise-item">
              <div class="exercise-item-info">
                <div class="exercise-item-name">${esc(ex.name)}</div>
                <div class="exercise-item-meta">${ico('sets')} ${ex.sets} <span style="opacity:.5">×</span> ${ico('reps')} ${ex.repsMin}${ex.repsMax!==ex.repsMin?'-'+ex.repsMax:''}</div>
              </div>
              <div class="exercise-item-actions">
                <button class="btn-icon" data-ei="${i}">${ico('edit')}</button>
                <button class="btn-icon" data-di="${i}">${ico('trash')}</button>
              </div>
            </div>`).join('')}
      </div>
      <button class="btn btn-secondary" id="btn-add-ex" style="margin-top:10px;">${ico('plus')} Agregar ejercicio</button>
      <div class="divider"></div>
      <button class="btn btn-primary" id="btn-save-r">${ico('check')} Guardar rutina</button>
      ${editing ? `<button class="btn btn-danger" id="btn-del-r" style="margin-top:8px;">${ico('trash')} Eliminar rutina</button>` : ''}
    `);
    $('#r-name').addEventListener('input', e => r.name = e.target.value);
    $('#r-day').addEventListener('change', e => r.day = parseInt(e.target.value));
    $('#btn-add-ex').addEventListener('click', () => openExEditor(null, ex => { r.exercises.push(ex); draw(); }, draw));
    $$('[data-ei]').forEach(b => b.addEventListener('click', () => {
      const i = parseInt(b.dataset.ei);
      openExEditor(r.exercises[i], ex => { r.exercises[i] = ex; draw(); }, draw);
    }));
    $$('[data-di]').forEach(b => b.addEventListener('click', () => { r.exercises.splice(parseInt(b.dataset.di),1); draw(); }));
    $('#btn-save-r').addEventListener('click', async () => {
      if (!r.name.trim()) { toast('Falta el nombre', true); return; }
      if (!r.exercises.length) { toast('Agregá al menos un ejercicio', true); return; }
      r.name = r.name.trim();
      if (editing) { const i = G.data.routines.findIndex(x => x.id === r.id); G.data.routines[i] = r; }
      else G.data.routines.push(r);
      closeModal(); renderRoutines(); renderHome();
      toast(editing ? 'Rutina actualizada' : 'Rutina creada ✓');
      cloudSave();
    });
    if (editing) {
      $('#btn-del-r').addEventListener('click', () => {
        if (confirm('¿Eliminar esta rutina? El historial se mantiene.')) {
          G.data.routines = G.data.routines.filter(x => x.id !== r.id);
          closeModal(); renderRoutines(); renderHome();
          toast('Rutina eliminada'); cloudSave();
        }
      });
    }
  }
  draw();
}

/* ── TRAINING ── */
function lastSessionFor(exId) {
  for (let i = G.data.sessions.length-1; i >= 0; i--) {
    const s = G.data.sessions[i];
    const ex = s.exercises.find(e => e.exerciseId === exId);
    if (ex && ex.sets && ex.sets.length) return { date: s.date, sets: ex.sets };
  }
  return null;
}

function startTraining(routineId) {
  const r = G.data.routines.find(x => x.id === routineId);
  if (!r || !r.exercises.length) { toast('Rutina vacía', true); return; }
  G.training = {
    routineId: r.id, routineName: r.name, exIdx: 0,
    exStates: r.exercises.map(ex => {
      const last = lastSessionFor(ex.id);
      return {
        exerciseId: ex.id, name: ex.name, sets: ex.sets,
        repsMin: ex.repsMin, repsMax: ex.repsMax, notes: ex.notes,
        lastSession: last,
        records: Array.from({length:ex.sets}, (_,i) => ({
          weight: last && last.sets[i] ? last.sets[i].weight : '',
          reps: '', done: false
        }))
      };
    })
  };
  closeModal();
  $('#training-shell').classList.add('active');
  $('#training-routine-name').textContent = r.name.toUpperCase();
  drawTrainingEx();
}

function drawTrainingEx() {
  const t = G.training, ex = t.exStates[t.exIdx], total = t.exStates.length;
  $('#t-current').textContent = t.exIdx + 1;
  $('#t-total').textContent   = total;
  $('#progress-fill').style.width = `${(t.exIdx / total) * 100}%`;

  let lastH = '';
  if (ex.lastSession) {
    const ss = ex.lastSession.sets.map(s => `${s.weight}×${s.reps}`).join(' · ');
    lastH = `<div class="last-session">
      <div class="last-session-label">ÚLTIMA SESIÓN · ${fmtD(ex.lastSession.date)}</div>
      <div class="last-session-data">${ss}</div>
    </div>`;
  }

  const setsH = ex.records.map((rec, i) => `
    <div class="set-row ${rec.done?'done':''}" data-si="${i}">
      <div class="set-num">${i+1}</div>
      <div class="input-with-icon">
        <span class="icon-prefix" data-icon="weight"></span>
        <input type="number" inputmode="decimal" placeholder="kg" value="${rec.weight}" data-w="${i}" />
      </div>
      <div class="input-with-icon">
        <span class="icon-prefix" data-icon="reps"></span>
        <input type="number" inputmode="numeric" placeholder="reps" value="${rec.reps}" data-r="${i}" />
      </div>
      <button class="set-check" data-ci="${i}">${rec.done ? IC.check : '<span style="font-size:18px;color:var(--text-faint);">○</span>'}</button>
    </div>`).join('');

  $('#training-body').innerHTML = `
    <div class="exercise-name">${esc(ex.name)}</div>
    <div class="exercise-meta">Objetivo: <span class="target">${ex.sets} × ${ex.repsMin}${ex.repsMax!==ex.repsMin?'-'+ex.repsMax:''} reps</span>${ex.notes?' · '+esc(ex.notes):''}</div>
    ${lastH}${setsH}`;
  injectIcons($('#training-body'));

  $$('input[data-w]').forEach(inp => inp.addEventListener('input', e => {
    ex.records[parseInt(e.target.dataset.w)].weight = e.target.value;
  }));
  $$('input[data-r]').forEach(inp => inp.addEventListener('input', e => {
    ex.records[parseInt(e.target.dataset.r)].reps = e.target.value;
  }));
  $$('[data-ci]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.dataset.ci);
    ex.records[i].done = !ex.records[i].done;
    const row = b.closest('.set-row');
    row.classList.toggle('done', ex.records[i].done);
    row.querySelector('.set-num').style.color = ex.records[i].done ? 'var(--accent)' : '';
    b.innerHTML = ex.records[i].done ? IC.check : '<span style="font-size:18px;color:var(--text-faint);">○</span>';
  }));

  const prevBtn = $('#btn-prev-ex');
  prevBtn.innerHTML = `${IC.arrowL} Atrás`;
  prevBtn.disabled  = (t.exIdx === 0);
  prevBtn.style.opacity = t.exIdx === 0 ? '0.3' : '1';
  $('#btn-next-ex').innerHTML = t.exIdx === total-1 ? `${IC.check} Finalizar` : `Siguiente ${IC.arrowR}`;
}

$('#btn-next-ex').addEventListener('click', () => {
  const t = G.training;
  if (t.exIdx < t.exStates.length-1) { t.exIdx++; drawTrainingEx(); $('#training-body').scrollTop = 0; }
  else finishTraining();
});
$('#btn-prev-ex').addEventListener('click', () => {
  const t = G.training;
  if (t.exIdx > 0) { t.exIdx--; drawTrainingEx(); $('#training-body').scrollTop = 0; }
});
$('#btn-cancel-training').addEventListener('click', () => {
  const t = G.training;
  const hasData = t.exStates.some(ex => ex.records.some(r => r.weight!==''||r.reps!==''||r.done));
  if (confirm(hasData ? '¿Cancelar? Vas a perder lo cargado.' : '¿Cancelar el entrenamiento?')) {
    G.training = null;
    $('#training-shell').classList.remove('active');
    toast('Entrenamiento cancelado');
  }
});

async function finishTraining() {
  const t = G.training;
  const exercises = t.exStates.map(ex => {
    const sets = ex.records.filter(r => r.weight!==''||r.reps!=='')
      .map(r => ({ weight: parseFloat(r.weight)||0, reps: parseInt(r.reps)||0, done: !!r.done }));
    return { exerciseId: ex.exerciseId, name: ex.name, sets };
  }).filter(e => e.sets.length > 0);

  if (!exercises.length) {
    if (!confirm('No cargaste ninguna serie. ¿Salir igual?')) return;
    G.training = null; $('#training-shell').classList.remove('active'); return;
  }

  const session = {
    id: uid(), cloudId: null,
    routineId: t.routineId, routineName: t.routineName,
    date: new Date().toISOString(), exercises
  };
  G.data.sessions.unshift(session);
  saveLocal();

  // Cerrar y navegar inmediatamente — cloud en background
  G.training = null;
  $('#training-shell').classList.remove('active');
  toast('Sesión guardada ✓');
  setView('home');
  cloudSave();
}

/* ── HISTORY ── */
function renderHistory() {
  const exMap = {};
  G.data.sessions.forEach(s => s.exercises.forEach(ex => {
    if (!exMap[ex.exerciseId]) exMap[ex.exerciseId] = { id:ex.exerciseId, name:ex.name, sessions:[] };
    exMap[ex.exerciseId].sessions.push({ date:s.date, sets:ex.sets });
  }));
  G.data.routines.forEach(r => r.exercises.forEach(ex => {
    if (!exMap[ex.id]) exMap[ex.id] = { id:ex.id, name:ex.name, sessions:[] };
  }));

  const list = Object.values(exMap).sort((a,b) => a.name.localeCompare(b.name));
  const q    = $('#history-search').value.toLowerCase().trim();
  const filt = q ? list.filter(x => x.name.toLowerCase().includes(q)) : list;

  if (!list.length) {
    $('#history-list').innerHTML = `<div class="empty"><div class="empty-icon" data-icon="emptyBox"></div>
      <div class="empty-text">Aún no hay datos.<br>Hacé tu primer entrenamiento.</div></div>`;
    injectIcons($('#history-list')); return;
  }

  $('#history-list').innerHTML = filt.map(ex => {
    const cnt = ex.sessions.length;
    let pr=0, prR=0;
    ex.sessions.forEach(s => s.sets.forEach(st => { if(st.weight>pr){pr=st.weight;prR=st.reps;} }));
    const meta = cnt===0 ? 'Sin sesiones registradas'
      : `${ico('chart')} ${cnt} sesió${cnt===1?'n':'nes'} <span style="opacity:.5">·</span> ${ico('trophy')} ${pr}kg${prR?' × '+prR:''}`;
    return `<div class="card" onclick="openExerciseHistory('${ex.id}')">
      <div class="card-title"><span>${esc(ex.name)}</span><span style="color:var(--text-faint);font-size:14px;">→</span></div>
      <div class="card-meta">${meta}</div>
    </div>`;
  }).join('');
  injectIcons($('#history-list'));
}
$('#history-search').addEventListener('input', renderHistory);

function openExerciseHistory(exId) {
  const sessions = [];
  G.data.sessions.forEach(s => {
    const ex = s.exercises.find(e => e.exerciseId === exId);
    if (ex) sessions.push({ date:s.date, sets:ex.sets });
  });
  sessions.sort((a,b) => new Date(a.date) - new Date(b.date));

  let name = '';
  for (const r of G.data.routines) { const e=r.exercises.find(x=>x.id===exId); if(e){name=e.name;break;} }
  if (!name && sessions.length) {
    const s = G.data.sessions.find(s => s.exercises.some(e => e.exerciseId===exId));
    name = s?.exercises.find(e => e.exerciseId===exId)?.name || '';
  }

  let pr=0, prR=0, prDate=null, best1RM=0;
  sessions.forEach(s => s.sets.forEach(st => {
    if (st.weight>pr||(st.weight===pr&&st.reps>prR)) { pr=st.weight; prR=st.reps; prDate=s.date; }
    const est = st.weight*(1+st.reps/30); if(est>best1RM) best1RM=est;
  }));

  const total = sessions.length, last = sessions[sessions.length-1];
  const pts = sessions.map(s => {
    const top = s.sets.reduce((m,st) => st.weight>m.weight?st:m, s.sets[0]);
    return { date:s.date, weight:top.weight, reps:top.reps };
  });

  openModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">${esc(name||'Ejercicio')}</div>
    ${total===0 ? `<div class="empty"><div class="empty-text">Sin sesiones registradas todavía</div></div>` : `
      <div class="history-stat-grid">
        <div class="stat-block">
          <div class="stat-label label-with-icon">${ico('trophy')} PR</div>
          <div class="stat-value">${pr}<span style="font-size:14px;color:var(--text-dim);font-family:'Space Mono';">kg</span></div>
          <div class="stat-value-sub">${prR} reps · ${prDate?fmtD(prDate):'—'}</div>
        </div>
        <div class="stat-block">
          <div class="stat-label label-with-icon">${ico('chart')} Sesiones</div>
          <div class="stat-value">${total}</div>
          <div class="stat-value-sub">1RM ~${best1RM.toFixed(1)}kg</div>
        </div>
      </div>
      <div class="chart-wrap">
        <div class="chart-title">${ico('chart')} EVOLUCIÓN — Top set</div>
        ${sparkline(pts)}
      </div>
      <div class="muted" style="margin-bottom:10px;">ÚLTIMA SESIÓN — ${last?fmtDL(last.date):''}</div>
      <div class="history-list-item">
        <div class="history-sets">${last.sets.map(s=>`<div class="history-set-pill ${s.weight===pr&&s.reps===prR?'pr':''}">${s.weight}kg × ${s.reps}</div>`).join('')}</div>
      </div>
      <div class="muted" style="margin:20px 0 10px;">HISTORIAL COMPLETO</div>
      ${[...sessions].reverse().map(s=>`
        <div class="history-list-item">
          <div class="history-date">${fmtDL(s.date)}</div>
          <div class="history-sets">${s.sets.map(st=>`<div class="history-set-pill ${st.weight===pr&&st.reps===prR?'pr':''}">${st.weight}kg × ${st.reps}</div>`).join('')}</div>
        </div>`).join('')}
    `}
  `);
}

function sparkline(pts) {
  if (!pts.length) return '<div class="muted" style="text-align:center;padding:20px;">Sin datos</div>';
  if (pts.length===1) return '<div class="muted" style="text-align:center;padding:30px 0;">Hacé al menos 2 sesiones para ver la curva</div>';
  const W=600,H=200,PL=42,PR=14,PT=14,PB=28;
  const ws=pts.map(p=>p.weight), mn=Math.min(...ws), mx=Math.max(...ws);
  function ticks(min,max,n=4){
    if(min===max){const p=Math.max(1,min*.1);min-=p;max+=p;}
    const raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),no=raw/mag;
    let s=no<1.5?mag:no<3?2*mag:no<7?5*mag:10*mag;
    const a=Math.floor(min/s)*s,b=Math.ceil(max/s)*s,t=[];
    for(let v=a;v<=b+s*.001;v+=s) t.push(parseFloat(v.toFixed(10)));
    return {t,min:a,max:b};
  }
  const {t:tk,min:yMn,max:yMx}=ticks(mn,mx), yr=yMx-yMn||1;
  const pw=W-PL-PR, ph=H-PT-PB, xs=pts.length>1?pw/(pts.length-1):0;
  const xo=i=>PL+i*xs, yo=w=>PT+ph-((w-yMn)/yr)*ph;
  const cs=pts.map((p,i)=>[xo(i),yo(p.weight),p]);
  const lp=cs.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const ap=lp+` L${cs[cs.length-1][0].toFixed(1)},${PT+ph} L${cs[0][0].toFixed(1)},${PT+ph} Z`;
  const ds=cs.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#d4ff00" stroke="#0a0a0a" stroke-width="1.5"/>`).join('');
  const gl=tk.map(v=>{const y=yo(v).toFixed(1),f=v===tk[0];
    return `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="${f?'#333':'#262626'}" stroke-width="1" stroke-dasharray="${f?'0':'2,3'}"/>
    <text x="${PL-6}" y="${y}" dy="3" text-anchor="end" font-family="Space Mono,monospace" font-size="9" fill="#b8b8b8">${fmtN(v)}</text>`;
  }).join('');
  const fd=iso=>{const d=new Date(iso);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;};
  const xl=[];
  xl.push({x:xo(0),t:fd(pts[0].date),a:'start'});
  if(pts.length>=4){const m=Math.floor(pts.length/2);xl.push({x:xo(m),t:fd(pts[m].date),a:'middle'});}
  if(pts.length>1) xl.push({x:xo(pts.length-1),t:fd(pts[pts.length-1].date),a:'end'});
  const xlt=xl.map(l=>`<text x="${l.x}" y="${H-8}" text-anchor="${l.a}" font-family="Space Mono,monospace" font-size="9" fill="#8a8a8a">${l.t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;max-width:100%;height:auto;">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4ff00" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#d4ff00" stop-opacity="0"/>
    </linearGradient></defs>
    ${gl}<text x="${PL-6}" y="${PT-2}" text-anchor="end" font-family="Space Mono,monospace" font-size="8" fill="#8a8a8a" letter-spacing="1.5">KG</text>
    <path d="${ap}" fill="url(#g)"/>
    <path d="${lp}" fill="none" stroke="#d4ff00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${ds}${xlt}
  </svg>`;
}
function fmtN(n) { return Math.abs(n-Math.round(n))<.001 ? String(Math.round(n)) : n.toFixed(1); }

/* ── SETTINGS ── */
$('#btn-export').addEventListener('click', () => {
  const b = new Blob([JSON.stringify(G.data,null,2)],{type:'application/json'});
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href=u; a.download=`ironlog-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(u);
  toast('Backup descargado');
});
$('#btn-import').addEventListener('click', () => $('#file-import').click());
$('#file-import').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const obj = JSON.parse(ev.target.result);
      if (!obj.routines||!obj.sessions) throw 0;
      if (!confirm('Esto reemplazará tus datos actuales. ¿Continuar?')) return;
      G.data = {...defData(),...obj};
      await cloudSave(); renderAll(); toast('Datos importados');
    } catch { toast('Archivo inválido', true); }
  };
  reader.readAsText(f);
});
$('#btn-clear').addEventListener('click', async () => {
  if (confirm('¿Borrar TODAS las rutinas y el historial? No se puede deshacer.')) {
    if (confirm('Última oportunidad. ¿Confirmás?')) {
      G.data = defData(); await cloudSave(); renderAll(); toast('Todo borrado');
    }
  }
});

/* ── MODAL ── */
function openModal(html) {
  $('#modal-content').innerHTML = `<div class="modal-handle"></div>${html}`;
  $('#modal-backdrop').classList.add('active');
  injectIcons($('#modal-content'));
}
function closeModal() { $('#modal-backdrop').classList.remove('active'); }
$('#modal-backdrop').addEventListener('click', e => { if (e.target===$('#modal-backdrop')) closeModal(); });

/* ── SERVICE WORKER ── */
if ('serviceWorker' in navigator)
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ── INIT ── */
renderHeader();
injectIcons();

// Globals para onclick inline
window.setView            = setView;
window.openRoutineDetail  = openRoutineDetail;
window.openRoutineEditor  = openRoutineEditor;
window.startTraining      = startTraining;
window.openExerciseHistory= openExerciseHistory;
window.closeModal         = closeModal;
</script>
</body>
