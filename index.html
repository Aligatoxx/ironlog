<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="IRONLOG" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>IRONLOGGGGGG — Tu gym tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0a0a;
  --bg-2: #131313;
  --bg-3: #1c1c1c;
  --line: #262626;
  --line-2: #333;
  --text: #f5f5f5;
  --text-dim: #b8b8b8;
  --text-faint: #8a8a8a;
  --accent: #d4ff00;
  --accent-dim: #9ab800;
  --danger: #ff3b3b;
  --success: #4ade80;
  --warn: #ffb020;
  --radius: 4px;
  --radius-lg: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family: 'Archivo', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  overscroll-behavior: none;
  padding-top: var(--safe-top);
  padding-bottom: calc(72px + var(--safe-bottom));
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 20% 0%, rgba(212,255,0,0.06), transparent 50%),
    radial-gradient(circle at 80% 100%, rgba(212,255,0,0.04), transparent 50%);
  pointer-events: none;
  z-index: 0;
}
#app { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }

/* HEADER */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 0.08em;
  line-height: 1;
}
.brand span { color: var(--accent); }
.brand-sub {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--text-faint);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 2px;
}
.header-right {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  text-align: right;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* VIEWS */
.view { padding: 20px; display: none; animation: fadeIn 0.25s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.view-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 4px;
}
.view-subtitle {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 24px;
}

/* CARDS */
.card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 12px;
  transition: border-color 0.15s, transform 0.1s;
  cursor: pointer;
}
.card:active { transform: scale(0.99); }
.card-title {
  font-family: 'Archivo', sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.01em;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.card-meta {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.card-meta .icon { color: var(--accent); opacity: 0.85; }
.card-meta .icon svg { width: 12px; height: 12px; }
.card-day-badge {
  display: inline-block;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  padding: 3px 8px;
  background: var(--accent);
  color: #000;
  font-weight: 700;
  border-radius: 3px;
  text-transform: uppercase;
}

/* BUTTONS */
.btn {
  font-family: 'Archivo', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  padding: 14px 20px;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s;
  text-transform: uppercase;
  width: 100%;
}
.btn svg { flex-shrink: 0; }
.btn .icon { display: inline-flex; align-items: center; }
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--accent);
  color: #000;
}
.btn-primary:disabled { background: var(--line-2); color: var(--text-faint); cursor: not-allowed; }
.btn-secondary {
  background: var(--bg-3);
  color: var(--text);
  border: 1px solid var(--line-2);
}
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--line); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-sm { padding: 8px 12px; font-size: 12px; width: auto; }

.btn-icon {
  background: var(--bg-3);
  border: 1px solid var(--line);
  color: var(--text);
  width: 38px; height: 38px;
  border-radius: var(--radius);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 18px;
  transition: all 0.15s;
}
.btn-icon:active { transform: scale(0.92); }
.btn-icon svg { width: 16px; height: 16px; }

/* FORMS */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.field label.label-with-icon { display: flex; align-items: center; gap: 5px; }
.field label.label-with-icon .icon svg { width: 13px; height: 13px; }
input, select, textarea {
  width: 100%;
  background: var(--bg-3);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 12px 14px;
  border-radius: var(--radius);
  font-family: 'Archivo', sans-serif;
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="number"] {
  font-family: 'Space Mono', monospace;
  text-align: center;
  font-weight: 700;
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

/* EMPTY STATE */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; display: flex; justify-content: center; align-items: center; color: var(--text-dim); }
.empty-icon svg { width: 56px; height: 56px; }
.empty-text {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 20px;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  display: flex;
  z-index: 100;
  padding-bottom: var(--safe-bottom);
}
.nav-item {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-faint);
  padding: 12px 8px;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: color 0.15s;
  position: relative;
}
.nav-item.active { color: var(--accent); }
.nav-item.active::before {
  content: ""; position: absolute; top: 0; left: 30%; right: 30%;
  height: 2px; background: var(--accent);
}
.nav-icon { font-size: 20px; line-height: 0; display: flex; align-items: center; justify-content: center; height: 20px; }
.nav-icon svg { width: 20px; height: 20px; }

/* TRAINING MODE */
.training-shell {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 200;
  display: none;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
.training-shell.active { display: flex; }
.training-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.training-progress {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--text-dim);
}
.training-progress span { color: var(--accent); font-weight: 700; }
.progress-bar {
  height: 3px;
  background: var(--bg-3);
  position: relative;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s;
}
.training-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
}
.exercise-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 44px;
  line-height: 1;
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}
.exercise-meta {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.exercise-meta .target {
  color: var(--accent);
  font-weight: 700;
}
.last-session {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  margin-bottom: 20px;
  border-radius: var(--radius);
}
.last-session-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.last-session-data {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--text);
}

.set-row {
  display: grid;
  grid-template-columns: 36px 1fr 1fr 44px;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
  padding: 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.set-row.done { border-color: var(--accent); background: rgba(212,255,0,0.04); }
.set-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  text-align: center;
  color: var(--text-dim);
}
.set-row.done .set-num { color: var(--accent); }
.set-row input {
  padding: 10px 6px 10px 26px;
  font-size: 16px;
  background: var(--bg-3);
}
.set-row .icon-prefix svg { width: 13px; height: 13px; }
.set-check {
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--text-dim);
  width: 100%;
  height: 40px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  padding: 0;
}
.set-check svg { width: 16px; height: 16px; }
.set-row.done .set-check {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}

.training-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  background: var(--bg-2);
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 10px;
}

/* HISTORIAL */
.history-stat-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin-bottom: 20px;
}
.stat-block {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.stat-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.stat-label.label-with-icon { display: flex; align-items: center; gap: 4px; }
.stat-label .icon { color: var(--accent); }
.stat-label .icon svg { width: 12px; height: 12px; }
.stat-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  line-height: 1;
  color: var(--accent);
}
.stat-value-sub {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 4px;
}

.chart-wrap {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 20px;
}
.chart-title {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.chart-title.label-with-icon { display: flex; align-items: center; gap: 6px; }
.chart-title .icon { color: var(--accent); }
.chart-title .icon svg { width: 13px; height: 13px; }

.history-list-item {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
}
.history-date {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.history-sets {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.history-set-pill {
  background: var(--bg-3);
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid var(--line-2);
}
.history-set-pill.pr { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

/* MODAL */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-backdrop.active { display: flex; }
.modal {
  background: var(--bg-2);
  width: 100%;
  max-width: 600px;
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  max-height: 90vh;
  overflow-y: auto;
  border-top: 1px solid var(--line);
  animation: slideUp 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
  width: 36px; height: 4px;
  background: var(--line-2);
  border-radius: 2px;
  margin: -8px auto 16px;
}
.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 18px;
}

/* EXERCISE LIST IN ROUTINE EDITOR */
.exercise-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.exercise-item-info { flex: 1; min-width: 0; }
.exercise-item-name {
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.exercise-item-meta {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
}
.exercise-item-meta .icon { color: var(--accent); opacity: 0.85; }
.exercise-item-meta .icon svg { width: 12px; height: 12px; }
.exercise-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

.divider {
  height: 1px; background: var(--line);
  margin: 16px 0;
}

.toast {
  position: fixed;
  bottom: calc(80px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--accent);
  color: #000;
  padding: 10px 18px;
  border-radius: var(--radius);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 400;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.fab-add {
  position: fixed;
  bottom: calc(84px + var(--safe-bottom));
  right: 20px;
  width: 56px; height: 56px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 50%;
  font-size: 28px;
  font-weight: 700;
  cursor: pointer;
  z-index: 90;
  box-shadow: 0 8px 20px rgba(212,255,0,0.25);
  display: none;
}
.fab-add.visible { display: flex; align-items: center; justify-content: center; }
.fab-add:active { transform: scale(0.95); }

/* HISTORIAL VIEW SEARCH */
.search-input {
  margin-bottom: 12px;
}

/* small helper */
.text-dim { color: var(--text-dim); }
.text-accent { color: var(--accent); }
.font-mono { font-family: 'Space Mono', monospace; }
.muted { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; }

/* ICONS */
.icon { display: inline-block; vertical-align: middle; line-height: 0; }
.icon svg { display: block; }
.label-with-icon { display: flex; align-items: center; gap: 6px; }
.label-with-icon .icon { color: var(--accent); }

/* set-row con icono adentro del input */
.input-with-icon { position: relative; }
.input-with-icon .icon-prefix {
  position: absolute;
  left: 8px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  pointer-events: none;
  z-index: 1;
}
.input-with-icon input { padding-left: 28px; }

.exercise-meta-icons { display: inline-flex; align-items: center; gap: 4px; }

select { background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }

</style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="brand">IRON<span>LOG</span></div>
      <div class="brand-sub" id="header-sub">Tu gym tracker</div>
    </div>
    <div class="header-right" id="header-right">
      <div id="today-label">—</div>
    </div>
  </div>

  <!-- VIEW: HOY -->
  <div class="view active" id="view-home">
    <div class="view-title">Hoy</div>
    <div class="view-subtitle" id="home-sub">Elegí qué entrenar</div>
    <div id="home-content"></div>
  </div>

  <!-- VIEW: RUTINAS -->
  <div class="view" id="view-routines">
    <div class="view-title">Rutinas</div>
    <div class="view-subtitle">Tus splits guardados</div>
    <div id="routines-list"></div>
  </div>

  <!-- VIEW: HISTORIAL -->
  <div class="view" id="view-history">
    <div class="view-title">Progreso</div>
    <div class="view-subtitle">Por ejercicio</div>
    <div class="input-with-icon" style="margin-bottom: 12px;">
      <span class="icon-prefix" data-icon="search" style="left:12px;"></span>
      <input type="text" class="search-input" id="history-search" placeholder="Buscar ejercicio..." style="padding-left:36px; margin-bottom:0;" />
    </div>
    <div id="history-list"></div>
  </div>

  <!-- VIEW: AJUSTES -->
  <div class="view" id="view-settings">
    <div class="view-title">Ajustes</div>
    <div class="view-subtitle">Datos & preferencias</div>
    <button class="btn btn-secondary" id="btn-export" style="margin-bottom: 10px;">Exportar datos (JSON)</button>
    <button class="btn btn-secondary" id="btn-import" style="margin-bottom: 10px;">Importar datos</button>
    <input type="file" id="file-import" accept="application/json" style="display:none">
    <div class="divider"></div>
    <button class="btn btn-danger" id="btn-clear">Borrar todo</button>
    <div class="divider"></div>
    <div class="muted" style="text-align:center; line-height:1.6;">
      IRONLOG v1.0<br>
      Tus datos se guardan en este dispositivo.
    </div>
  </div>

</div>

<!-- FAB -->
<button class="fab-add" id="fab-add">+</button>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" data-view="home">
    <span class="nav-icon" data-icon="home"></span>HOY
  </button>

function toast(msg) {
  const t = $('#toast'); t.textContent = msg;
  t.classList.add('show');

  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Inject SVG icons into elements with data-icon
function injectIcons(root=document) {
  $$('[data-icon]', root).forEach(el => {
    const name = el.dataset.icon;
    if (ICONS[name] && !el.dataset.iconLoaded) {
      el.innerHTML = ICONS[name];
      el.dataset.iconLoaded = '1';
    }
  });
}

// ---------- HOME ----------
function renderHome() {
  const today = todayDayIndex();
  const routines = state.data.routines;
  const todayRoutines = routines.filter(r => r.day === today);
  const otherRoutines = routines.filter(r => r.day !== today);

  $('#home-sub').textContent = todayRoutines.length
    ? `Hoy es ${dayNames[today].toLowerCase()}`
    : 'No hay rutina asignada para hoy';

  let html = '';

  if (routines.length === 0) {
    html = `
      <div class="empty">
        <div class="empty-icon" data-icon="emptyBox"></div>
        <div class="empty-text">Aún no creaste rutinas</div>
        <button class="btn btn-primary" onclick="openRoutineEditor()">${icon('plus')} Crear mi primera rutina</button>
      </div>`;
  } else {
    if (todayRoutines.length) {
      html += `<div class="muted" style="margin-bottom:10px;">PARA HOY</div>`;
      todayRoutines.forEach(r => html += routineCardHTML(r, true));
    }
    if (otherRoutines.length) {
      html += `<div class="muted" style="margin: 24px 0 10px;">OTRAS RUTINAS</div>`;
      otherRoutines.forEach(r => html += routineCardHTML(r, false));
    }
  }

  $('#home-content').innerHTML = html;
  injectIcons($('#home-content'));

  $$('[data-start-routine]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      startTraining(b.dataset.startRoutine);
    });
  });
}

function routineCardHTML(r, isToday) {
  return `
    <div class="card" onclick="openRoutineDetail('${r.id}')">
      <div class="card-title">
        <span>${escapeHtml(r.name)}</span>
        ${isToday ? '<span class="card-day-badge">HOY</span>' : ''}
      </div>
      <div class="card-meta">${icon('calendar')} ${dayNames[r.day]} <span style="opacity:0.5">·</span> ${icon('sets')} ${r.exercises.length} ejercicio${r.exercises.length===1?'':'s'}</div>
      <button class="btn btn-primary btn-sm" style="margin-top:12px;" data-start-routine="${r.id}">${icon('play')} Empezar</button>
    </div>`;
}

// ---------- ROUTINES VIEW ----------
function renderRoutines() {
  const list = state.data.routines;
  if (!list.length) {
    $('#routines-list').innerHTML = `
      <div class="empty">
        <div class="empty-icon" data-icon="emptyBox"></div>
        <div class="empty-text">No hay rutinas todavía</div>
        <button class="btn btn-primary" onclick="openRoutineEditor()">${icon('plus')} Crear nueva rutina</button>
      </div>`;
    injectIcons($('#routines-list'));
    return;
  }
  let byDay = [...list].sort((a,b) => a.day - b.day);
  $('#routines-list').innerHTML = byDay.map(r => routineCardHTML(r, r.day === todayDayIndex())).join('');
  injectIcons($('#routines-list'));
  $$('[data-start-routine]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      startTraining(b.dataset.startRoutine);
    });
  });
}

// ---------- ROUTINE EDITOR ----------
function openRoutineEditor(routineId = null) {
  const editing = routineId ? state.data.routines.find(r => r.id === routineId) : null;
  const r = editing ? JSON.parse(JSON.stringify(editing)) : {
    id: uid(),
    name: '',
    day: todayDayIndex(),
    exercises: []
  };

  function render() {
    openModal(`
      <div class="modal-title">${editing ? 'Editar rutina' : 'Nueva rutina'}</div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="r-name" placeholder="Ej: Pecho + Tríceps" value="${escapeHtml(r.name)}" />
      </div>
      <div class="field">
        <label class="label-with-icon">${icon('calendar')} Día</label>
        <select id="r-day">
          ${dayNames.map((n,i) => `<option value="${i}" ${r.day===i?'selected':''}>${n}</option>`).join('')}
        </select>
      </div>
      <div class="divider"></div>
      <div class="muted" style="margin-bottom:10px;">EJERCICIOS</div>
      <div id="ex-list">
        ${r.exercises.length === 0
          ? '<div class="muted" style="text-align:center; padding:20px 0;">Sin ejercicios cargados</div>'
          : r.exercises.map((ex, i) => `
            <div class="exercise-item">
              <div class="exercise-item-info">
                <div class="exercise-item-name">${escapeHtml(ex.name)}</div>
                <div class="exercise-item-meta">${icon('sets')} ${ex.sets} <span style="opacity:0.5">×</span> ${icon('reps')} ${ex.repsMin}${ex.repsMax!==ex.repsMin?'-'+ex.repsMax:''}</div>
              </div>
              <div class="exercise-item-actions">
                <button class="btn-icon" data-edit-ex="${i}" title="Editar">${icon('edit')}</button>
                <button class="btn-icon" data-del-ex="${i}" title="Eliminar">${icon('trash')}</button>
              </div>
            </div>`).join('')}
      </div>
      <button class="btn btn-secondary" id="btn-add-ex" style="margin-top:10px;">${icon('plus')} Agregar ejercicio</button>
      <div class="divider"></div>
      <button class="btn btn-primary" id="btn-save-routine">${icon('check')} Guardar rutina</button>
      ${editing ? `<button class="btn btn-danger" id="btn-del-routine" style="margin-top:8px;">${icon('trash')} Eliminar rutina</button>` : ''}
    `);

    $('#r-name').addEventListener('input', e => r.name = e.target.value);
    $('#r-day').addEventListener('change', e => r.day = parseInt(e.target.value));

    $('#btn-add-ex').addEventListener('click', () => openExerciseEditor(null, (ex) => {
      r.exercises.push(ex);
      render();
    }, render));

    $$('[data-edit-ex]').forEach(b => {
      b.addEventListener('click', () => {
        const idx = parseInt(b.dataset.editEx);
        openExerciseEditor(r.exercises[idx], (ex) => {
          r.exercises[idx] = ex;
          render();
        }, render);
      });
    });
    $$('[data-del-ex]').forEach(b => {
      b.addEventListener('click', () => {
        const idx = parseInt(b.dataset.delEx);
        r.exercises.splice(idx, 1);
        render();
      });
    });

    $('#btn-save-routine').addEventListener('click', () => {
      if (!r.name.trim()) { toast('Falta el nombre'); return; }
      if (r.exercises.length === 0) { toast('Agregá al menos un ejercicio'); return; }
      r.name = r.name.trim();
      if (editing) {
        const idx = state.data.routines.findIndex(x => x.id === r.id);
        state.data.routines[idx] = r;
      } else {
        state.data.routines.push(r);
      }
      saveData();
      closeModal();
      renderRoutines();
      renderHome();
      toast(editing ? 'Rutina actualizada' : 'Rutina creada');
    });

    if (editing) {
      $('#btn-del-routine').addEventListener('click', () => {
        if (confirm('¿Eliminar esta rutina? El historial se mantiene.')) {
          state.data.routines = state.data.routines.filter(x => x.id !== r.id);
          saveData();
          closeModal();
          renderRoutines();
          renderHome();
          toast('Rutina eliminada');
        }
      });
    }
  }
  render();
}

    </div>

    <button class="btn btn-ghost" id="btn-cancel-ex" style="margin-top:8px;">Cancelar</button>
  `;

  injectIcons($('#modal-content'));
  setTimeout(() => $('#ex-name')?.focus(), 50);

  $('#btn-save-ex').addEventListener('click', () => {
    const name = $('#ex-name').value.trim();
    const sets = parseInt($('#ex-sets').value);
    const rmin = parseInt($('#ex-reps-min').value);
    const rmax = parseInt($('#ex-reps-max').value);
    const notes = $('#ex-notes').value.trim();
    if (!name) { toast('Falta el nombre'); return; }
    if (!sets || sets < 1) { toast('Series inválidas'); return; }
    if (!rmin || !rmax || rmax < rmin) { toast('Rango de reps inválido'); return; }
    ex.name = name; ex.sets = sets; ex.repsMin = rmin; ex.repsMax = rmax; ex.notes = notes;
    onSave(ex);
  });
  $('#btn-cancel-ex').addEventListener('click', () => {
    if (onCancel) onCancel();
    else closeModal();
  });
}

// ---------- ROUTINE DETAIL (read-only quick view + actions) ----------
function openRoutineDetail(routineId) {
  const r = state.data.routines.find(x => x.id === routineId);
  if (!r) return;
  openModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">${escapeHtml(r.name)}</div>
    <div class="card-meta" style="margin-bottom:16px;">${dayNames[r.day]} · ${r.exercises.length} ejercicio${r.exercises.length===1?'':'s'}</div>
    ${r.exercises.map(ex => `
      <div class="exercise-item">
        <div class="exercise-item-info">
          <div class="exercise-item-name">${escapeHtml(ex.name)}</div>
          <div class="exercise-item-meta">${ex.sets} × ${ex.repsMin}${ex.repsMax!==ex.repsMin?'-'+ex.repsMax:''} reps${ex.notes?' · '+escapeHtml(ex.notes):''}</div>
        </div>
      </div>
    `).join('')}
    <div class="divider"></div>

    <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeModal(); openRoutineEditor('${r.id}')">Editar</button>

// ---------- TRAINING MODE ----------
function startTraining(routineId) {
  const r = state.data.routines.find(x => x.id === routineId);
  if (!r || r.exercises.length === 0) { toast('Rutina vacía'); return; }
  state.training = {
    routineId: r.id,
    routineName: r.name,
    exerciseIndex: 0,
    startedAt: new Date().toISOString(),
    exerciseStates: r.exercises.map(ex => {
      const last = lastSessionFor(ex.id);
      return {
        exerciseId: ex.id,
        name: ex.name,
        sets: ex.sets,
        repsMin: ex.repsMin,
        repsMax: ex.repsMax,
        notes: ex.notes,
        lastSession: last,
        records: Array.from({length: ex.sets}, (_, i) => ({
          weight: last && last.sets[i] ? last.sets[i].weight : '',
          reps: '',
          done: false
        }))
      };
    })
  };
  $('#training-shell').classList.add('active');
  $('#training-routine-name').textContent = r.name.toUpperCase();
  renderTrainingExercise();
}

function renderTrainingExercise() {
  const t = state.training;
  const ex = t.exerciseStates[t.exerciseIndex];
  const total = t.exerciseStates.length;
  $('#t-current').textContent = t.exerciseIndex + 1;
  $('#t-total').textContent = total;
  $('#progress-fill').style.width = `${((t.exerciseIndex) / total) * 100}%`;

  // last session line
  let lastHTML = '';
  if (ex.lastSession) {
    const setsStr = ex.lastSession.sets.map(s => `${s.weight}×${s.reps}`).join(' · ');
    lastHTML = `
      <div class="last-session">
        <div class="last-session-label">ÚLTIMA SESIÓN · ${fmtDate(ex.lastSession.date)}</div>
        <div class="last-session-data">${setsStr}</div>
      </div>`;
  }

  const setsHTML = ex.records.map((rec, i) => `
    <div class="set-row ${rec.done?'done':''}" data-set="${i}">
      <div class="set-num">${i+1}</div>
      <div class="input-with-icon">
        <span class="icon-prefix" data-icon="weight"></span>
        <input type="number" inputmode="decimal" placeholder="${state.data.settings.weightUnit}" value="${rec.weight}" data-w="${i}" />
      </div>
      <div class="input-with-icon">
        <span class="icon-prefix" data-icon="reps"></span>
        <input type="number" inputmode="numeric" placeholder="reps" value="${rec.reps}" data-r="${i}" />
      </div>
      <button class="set-check" data-check="${i}">${rec.done?ICONS.check:'<span style="font-size:18px; color:var(--text-faint);">○</span>'}</button>
    </div>
  `).join('');

  $('#training-body').innerHTML = `
    <div class="exercise-name">${escapeHtml(ex.name)}</div>
    <div class="exercise-meta">
      Objetivo: <span class="target">${ex.sets} × ${ex.repsMin}${ex.repsMax!==ex.repsMin?'-'+ex.repsMax:''} reps</span>
      ${ex.notes?` · ${escapeHtml(ex.notes)}`:''}
    </div>
    ${lastHTML}
    ${setsHTML}
  `;
  injectIcons($('#training-body'));

  $$('input[data-w]').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = parseInt(e.target.dataset.w);
      ex.records[i].weight = e.target.value;
    });
  });
  $$('input[data-r]').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = parseInt(e.target.dataset.r);
      ex.records[i].reps = e.target.value;
    });
  });
  $$('[data-check]').forEach(b => {
    b.addEventListener('click', () => {
      const i = parseInt(b.dataset.check);
      ex.records[i].done = !ex.records[i].done;
      const row = b.closest('.set-row');
      row.classList.toggle('done', ex.records[i].done);
      b.innerHTML = ex.records[i].done ? ICONS.check : '<span style="font-size:18px; color:var(--text-faint);">○</span>';
    });
  });

  // button labels
  if (t.exerciseIndex === 0) {
    $('#btn-prev-ex').innerHTML = `${ICONS.close} Cancelar`;
    $('#btn-prev-ex').classList.remove('btn-ghost');
    $('#btn-prev-ex').classList.add('btn-danger');
  } else {
    $('#btn-prev-ex').innerHTML = `${ICONS.arrowLeft} Atrás`;
    $('#btn-prev-ex').classList.remove('btn-danger');
    $('#btn-prev-ex').classList.add('btn-ghost');
  }
  $('#btn-prev-ex').disabled = false;
  $('#btn-prev-ex').style.opacity = 1;
  $('#btn-next-ex').innerHTML = t.exerciseIndex === total - 1
    ? `${ICONS.check} Finalizar`
    : `Siguiente ${ICONS.arrowRight}`;
}

$('#btn-next-ex').addEventListener('click', () => {
  const t = state.training;
  if (t.exerciseIndex < t.exerciseStates.length - 1) {
    t.exerciseIndex++;
    renderTrainingExercise();
    $('#training-body').scrollTop = 0;
  } else {
    finishTraining();
  }
});
$('#btn-prev-ex').addEventListener('click', () => {
  const t = state.training;
  if (t.exerciseIndex > 0) {
    t.exerciseIndex--;
    renderTrainingExercise();
    $('#training-body').scrollTop = 0;
  } else {
    // Primer ejercicio: cancelar entrenamiento
    cancelTraining();
  }
});

function cancelTraining() {
  const t = state.training;
  // Detect si cargó algo
  let hasData = false;
  for (const ex of t.exerciseStates) {
    for (const r of ex.records) {
      if (r.weight !== '' || r.reps !== '' || r.done) { hasData = true; break; }
    }
    if (hasData) break;
  }
  const msg = hasData
    ? '¿Cancelar el entrenamiento? Vas a perder lo que cargaste.'
    : '¿Cancelar el entrenamiento?';
  if (confirm(msg)) {
    state.training = null;
    $('#training-shell').classList.remove('active');
    toast('Entrenamiento cancelado');
  }
}

$('#btn-finish-training').addEventListener('click', () => {
  cancelTraining();
});

function finishTraining() {
  const t = state.training;
  // Build session: only sets with weight or reps loaded
  const exercises = t.exerciseStates.map(ex => {
    const sets = ex.records
      .filter(r => r.weight !== '' || r.reps !== '')
      .map(r => ({
        weight: parseFloat(r.weight) || 0,
        reps: parseInt(r.reps) || 0,
        done: !!r.done
      }));
    return { exerciseId: ex.exerciseId, name: ex.name, sets };
  }).filter(e => e.sets.length > 0);

  if (exercises.length === 0) {
    if (!confirm('No cargaste ninguna serie. ¿Salir igual?')) return;
    state.training = null;
    $('#training-shell').classList.remove('active');
    return;
  }

  const session = {
    id: uid(),
    routineId: t.routineId,
    routineName: t.routineName,
    date: new Date().toISOString(),
    exercises
  };
  state.data.sessions.push(session);
  saveData();
  state.training = null;
  $('#training-shell').classList.remove('active');
  toast('Sesión guardada ✓');
  setView('history');
}

// ---------- HISTORY ----------
function lastSessionFor(exerciseId) {
  // Returns { date, sets:[{weight,reps}] } from the most recent session that has this exercise
  for (let i = state.data.sessions.length - 1; i >= 0; i--) {
    const s = state.data.sessions[i];
    const ex = s.exercises.find(e => e.exerciseId === exerciseId);
    if (ex && ex.sets.length) return { date: s.date, sets: ex.sets };
  }
  return null;
}

function renderHistory() {
  // collect unique exercises across all routines that have at least one session entry
  const exMap = {}; // exerciseId -> {name, sessions:[{date, sets}]}
  state.data.sessions.forEach(s => {
    s.exercises.forEach(ex => {
      if (!exMap[ex.exerciseId]) exMap[ex.exerciseId] = { id: ex.exerciseId, name: ex.name, sessions: [] };
      exMap[ex.exerciseId].sessions.push({ date: s.date, sets: ex.sets });
    });
  });

  // Also include exercises from routines that have no session yet (so list isn't empty before training)
  state.data.routines.forEach(r => {
    r.exercises.forEach(ex => {
      if (!exMap[ex.id]) exMap[ex.id] = { id: ex.id, name: ex.name, sessions: [] };
    });
  });

  const list = Object.values(exMap).sort((a,b) => a.name.localeCompare(b.name));
  const search = $('#history-search').value.toLowerCase().trim();
  const filtered = search ? list.filter(x => x.name.toLowerCase().includes(search)) : list;

  if (list.length === 0) {
    $('#history-list').innerHTML = `
      <div class="empty">
        <div class="empty-icon" data-icon="emptyBox"></div>
        <div class="empty-text">Aún no hay datos.<br>Hacé tu primer entrenamiento.</div>
      </div>`;
    injectIcons($('#history-list'));
    return;
  }

  $('#history-list').innerHTML = filtered.map(ex => {
    const sessions = ex.sessions;
    const sessionCount = sessions.length;
    const last = sessions[sessions.length - 1];
    let pr = 0, prReps = 0;
    sessions.forEach(s => s.sets.forEach(set => {
      if (set.weight > pr) { pr = set.weight; prReps = set.reps; }
    }));
    const meta = sessionCount === 0
      ? 'Sin sesiones registradas'
      : `${icon('chart')} ${sessionCount} sesió${sessionCount===1?'n':'nes'} <span style="opacity:0.5">·</span> ${icon('trophy')} ${pr}${state.data.settings.weightUnit}${prReps?` × ${prReps}`:''}`;
    return `
      <div class="card" onclick="openExerciseHistory('${ex.id}')">
        <div class="card-title"><span>${escapeHtml(ex.name)}</span><span style="color:var(--text-faint); font-size:14px;">→</span></div>
        <div class="card-meta">${meta}</div>
      </div>`;
  }).join('');
  injectIcons($('#history-list'));
}

$('#history-search').addEventListener('input', renderHistory);

function openExerciseHistory(exerciseId) {
  // gather sessions for this exercise
  const sessions = [];
  state.data.sessions.forEach(s => {
    const ex = s.exercises.find(e => e.exerciseId === exerciseId);
    if (ex) sessions.push({ date: s.date, sets: ex.sets });
  });
  sessions.sort((a,b) => new Date(a.date) - new Date(b.date));

  // Try also locate exercise name (might not have sessions)
  let name = '';
  for (const r of state.data.routines) {
    const e = r.exercises.find(x => x.id === exerciseId);
    if (e) { name = e.name; break; }
  }
  if (!name && sessions.length) name = state.data.sessions.find(s => s.exercises.some(e=>e.exerciseId===exerciseId)).exercises.find(e=>e.exerciseId===exerciseId).name;

  // Compute stats
  let pr = 0, prReps = 0, prDate = null;
  let bestSet1RM = 0;
  sessions.forEach(s => s.sets.forEach(set => {
    if (set.weight > pr || (set.weight === pr && set.reps > prReps)) {
      pr = set.weight; prReps = set.reps; prDate = s.date;
    }
    // Epley 1RM estimate
    const est = set.weight * (1 + set.reps/30);
    if (est > bestSet1RM) bestSet1RM = est;
  }));

  const totalSessions = sessions.length;
  const last = sessions[sessions.length - 1];
  const lastTopSet = last ? last.sets.reduce((m,s) => s.weight*s.reps > m.weight*m.reps ? s : m, last.sets[0]) : null;

  // Build chart data: top set weight per session
  const chartPoints = sessions.map(s => {
    const top = s.sets.reduce((m, st) => st.weight > m.weight ? st : m, s.sets[0]);
    return { date: s.date, weight: top.weight, reps: top.reps };
  });

  openModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">${escapeHtml(name || 'Ejercicio')}</div>

    ${totalSessions === 0 ? `
      <div class="empty"><div class="empty-text">Sin sesiones registradas todavía</div></div>
    ` : `
      <div class="history-stat-grid">
        <div class="stat-block">
          <div class="stat-label label-with-icon">${icon('trophy')} PR</div>
          <div class="stat-value">${pr}<span style="font-size:14px; color:var(--text-dim); font-family:'Space Mono';">${state.data.settings.weightUnit}</span></div>
          <div class="stat-value-sub">${prReps} reps · ${prDate ? fmtDate(prDate) : '—'}</div>
        </div>
        <div class="stat-block">
          <div class="stat-label label-with-icon">${icon('chart')} Sesiones</div>
          <div class="stat-value">${totalSessions}</div>
          <div class="stat-value-sub">1RM est ~${bestSet1RM.toFixed(1)}${state.data.settings.weightUnit}</div>
        </div>
      </div>

      <div class="chart-wrap">
        <div class="chart-title label-with-icon">${icon('chart')} EVOLUCIÓN — Top set por sesión</div>
        ${renderSparkline(chartPoints)}
      </div>

      <div class="muted" style="margin-bottom:10px;">ÚLTIMA SESIÓN — ${last ? fmtDateLong(last.date) : ''}</div>
      <div class="history-list-item">
        <div class="history-sets">
          ${last.sets.map(s => `<div class="history-set-pill ${s.weight===pr && s.reps===prReps?'pr':''}">${s.weight}${state.data.settings.weightUnit} × ${s.reps}</div>`).join('')}
        </div>
      </div>

      <div class="muted" style="margin: 20px 0 10px;">HISTORIAL COMPLETO</div>
      ${[...sessions].reverse().map(s => `
        <div class="history-list-item">
          <div class="history-date">${fmtDateLong(s.date)}</div>
          <div class="history-sets">
            ${s.sets.map(set => `<div class="history-set-pill ${set.weight===pr && set.reps===prReps?'pr':''}">${set.weight}${state.data.settings.weightUnit} × ${set.reps}</div>`).join('')}
          </div>
        </div>
      `).join('')}
    `}
  `);
}

function renderSparkline(points) {
  if (!points.length) return '<div class="muted" style="text-align:center; padding:20px;">Sin datos</div>';
  if (points.length === 1) return `<div class="muted" style="text-align:center; padding:30px 0;">Necesitás al menos 2 sesiones para ver la curva</div>`;

  const unit = state.data.settings.weightUnit;
  const W = 600, H = 200;
  const PAD_L = 42;   // izquierda para etiquetas Y
  const PAD_R = 14;
  const PAD_T = 14;
  const PAD_B = 28;   // abajo para etiquetas X

  const weights = points.map(p => p.weight);
  let minW = Math.min(...weights);
  let maxW = Math.max(...weights);

  // Calcular ticks "lindos" del eje Y (4-5 niveles)
  function niceTicks(min, max, count = 4) {
    if (min === max) {
      const pad = Math.max(1, min * 0.1);
      min = min - pad; max = max + pad;
    }
    const range = max - min;
    const rawStep = range / count;
    const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / magnitude;
    let step;
    if (norm < 1.5) step = 1 * magnitude;
    else if (norm < 3) step = 2 * magnitude;
    else if (norm < 7) step = 5 * magnitude;
    else step = 10 * magnitude;
    const niceMin = Math.floor(min / step) * step;
    const niceMax = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = niceMin; v <= niceMax + step*0.001; v += step) {
      ticks.push(parseFloat(v.toFixed(10)));
    }
    return { ticks, min: niceMin, max: niceMax, step };
  }

  const { ticks, min: yMin, max: yMax } = niceTicks(minW, maxW, 4);
  const yRange = yMax - yMin || 1;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;
  const xStep = points.length > 1 ? plotW / (points.length - 1) : 0;

  const xOf = i => PAD_L + i * xStep;
  const yOf = w => PAD_T + plotH - ((w - yMin) / yRange) * plotH;

  const coords = points.map((p, i) => [xOf(i), yOf(p.weight), p]);

  const linePath = coords.map((c, i) => (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const areaPath = linePath
    + ` L${coords[coords.length-1][0].toFixed(1)},${PAD_T+plotH}`
    + ` L${coords[0][0].toFixed(1)},${PAD_T+plotH} Z`;

  const dots = coords.map(c =>
    `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#d4ff00" stroke="#0a0a0a" stroke-width="1.5"/>`
  ).join('');

  // Grid lines + labels Y
  const gridLines = ticks.map(t => {
    const y = yOf(t).toFixed(1);
    const isFirst = t === ticks[0];
    return `
      <line x1="${PAD_L}" y1="${y}" x2="${W-PAD_R}" y2="${y}"
            stroke="${isFirst?'#333':'#262626'}" stroke-width="1" stroke-dasharray="${isFirst?'0':'2,3'}"/>
      <text x="${PAD_L-6}" y="${y}" dy="3" text-anchor="end"
            font-family="Space Mono, monospace" font-size="9" fill="#b8b8b8">
        ${formatNum(t)}
      </text>
    `;
  }).join('');

  // Etiquetas X (primera y última, intermedio si hay >=4)
  const xLabels = [];
  const fmt = (iso) => {
    const d = new Date(iso);
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  };
  if (points.length > 0) {
    xLabels.push({ x: xOf(0), txt: fmt(points[0].date), anchor: 'start' });
    if (points.length >= 4) {
      const mid = Math.floor(points.length / 2);
      xLabels.push({ x: xOf(mid), txt: fmt(points[mid].date), anchor: 'middle' });
    }
    if (points.length > 1) {
      xLabels.push({ x: xOf(points.length-1), txt: fmt(points[points.length-1].date), anchor: 'end' });
    }
  }
  const xLabelsHTML = xLabels.map(l =>
    `<text x="${l.x}" y="${H-8}" text-anchor="${l.anchor}"
           font-family="Space Mono, monospace" font-size="9" fill="#8a8a8a">${l.txt}</text>`
  ).join('');

  // Y axis label (kg)
  const yAxisLabel = `<text x="${PAD_L-6}" y="${PAD_T-2}" text-anchor="end"
    font-family="Space Mono, monospace" font-size="8" fill="#8a8a8a" letter-spacing="1.5">${unit.toUpperCase()}</text>`;

  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block; max-width:100%; height:auto;">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d4ff00" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#d4ff00" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      ${yAxisLabel}
      <path d="${areaPath}" fill="url(#grad)"/>
      <path d="${linePath}" fill="none" stroke="#d4ff00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${xLabelsHTML}
    </svg>
  `;
}

function formatNum(n) {
  if (Math.abs(n - Math.round(n)) < 0.001) return String(Math.round(n));
  return n.toFixed(1);
}

$('#btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ironlog-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup descargado');
});
$('#btn-import').addEventListener('click', () => $('#file-import').click());
$('#file-import').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const obj = JSON.parse(ev.target.result);
      if (!obj.routines || !obj.sessions) throw new Error('Formato inválido');
      if (!confirm('Esto reemplazará tus datos actuales. ¿Continuar?')) return;
      state.data = { ...defaultData(), ...obj };
      saveData();
      toast('Datos importados');
      renderHome(); renderRoutines(); renderHistory();
    } catch(err) {
      toast('Archivo inválido');
    }
  };
  reader.readAsText(file);
});
$('#btn-clear').addEventListener('click', () => {
  if (confirm('¿Borrar TODAS las rutinas y el historial? No se puede deshacer.')) {
    if (confirm('Última oportunidad. ¿Confirmás?')) {
      state.data = defaultData();
      saveData();
      toast('Todo borrado');
      renderHome(); renderRoutines(); renderHistory();
    }
  }
});
